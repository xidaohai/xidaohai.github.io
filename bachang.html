<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>测验靶场 · V2人偶定制版 (西岛海)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --crosshair-color: #000000;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            overflow: hidden;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            width: 100vw;
            height: 100vh;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 3px;
            height: 3px;
            background: var(--crosshair-color);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
            transition: transform 0.08s, background 0.1s;
        }
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: var(--crosshair-color);
            transition: background 0.1s;
        }
        #crosshair::before {
            top: -6px;
            bottom: -6px;
            left: 1px;
            right: 1px;
        }
        #crosshair::after {
            left: -6px;
            right: -6px;
            top: 1px;
            bottom: 1px;
        }
        #crosshair.on-target {
            transform: translate(-50%, -50%) scale(1.6);
            box-shadow: 0 0 8px var(--crosshair-color);
        }

        #top-hud {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }
        .hud-card {
            background: rgba(255, 255, 255, 0.62);
            backdrop-filter: blur(28px) saturate(190%);
            padding: 7px 16px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #334155;
            border: 1px solid rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }
        .hud-val { color: #0284c7; font-weight: 900; }
        .fps-val { color: #16a34a; font-weight: 900; }

        .f11-card {
            padding: 7px 16px;
            font-size: 0.8rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            transition: all 0.5s;
        }
        .f11-highlight {
            background: #ef4444 !important;
            color: #ffffff !important;
            border-color: #f87171 !important;
            box-shadow: 0 0 14px rgba(239, 68, 68, 0.4) !important;
        }

        #author-card {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: rgba(255, 255, 255, 0.62);
            backdrop-filter: blur(24px) saturate(180%);
            padding: 6px 14px 6px 6px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.85);
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
            z-index: 5;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            transition: transform 0.15s, background 0.15s, border-color 0.15s;
            cursor: pointer;
        }
        #author-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.88);
            border-color: #0284c7;
        }
        .author-avatar-badge {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            font-weight: 900;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.25);
        }
        .author-meta { display: flex; flex-direction: column; }
        .author-name { font-size: 0.76rem; font-weight: 900; color: #0f172a; }
        .author-tag { font-size: 0.58rem; color: #64748b; font-weight: bold; }

        #bottom-right-hud {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 320px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(24px) saturate(180%);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-left: 3.5px solid #0284c7;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            pointer-events: none;
            z-index: 5;
        }
        .rel-title { font-size: 0.74rem; font-weight: 900; color: #0284c7; margin-bottom: 4px; }
        .rel-formula {
            font-size: 0.68rem;
            font-weight: 700;
            color: #1e293b;
            background: rgba(2, 132, 199, 0.06);
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 4px;
            line-height: 1.4;
        }
        .rel-desc { font-size: 0.64rem; color: #64748b; line-height: 1.4; }

        #draggable-panel {
            position: absolute;
            left: 18px;
            top: 56px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            z-index: 20;
            transition: opacity 0.15s;
            max-height: 88vh;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(28px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-top: 3.5px solid #0284c7;
            border-radius: 10px;
            padding: 12px 14px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.06);
            width: 380px;
            max-height: 88vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .glass-panel::-webkit-scrollbar { width: 4px; }
        .glass-panel::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            margin-bottom: 4px;
            cursor: move;
        }
        .panel-title {
            font-size: 0.84rem;
            font-weight: 900;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .panel-title::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 12px;
            background: #0284c7;
            border-radius: 2px;
        }
        .header-actions { display: flex; gap: 5px; align-items: center; }
        .header-btn {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #cbd5e1;
            font-size: 0.65rem;
            font-weight: 800;
            color: #475569;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.15s;
        }
        .header-btn:hover { background: #e0f2fe; border-color: #0284c7; color: #0284c7; }
        .header-btn.active { background: #0284c7; color: #ffffff; border-color: #0284c7; }

        .section-card {
            background: rgba(248, 250, 252, 0.65);
            border: 1px solid rgba(226, 232, 240, 0.85);
            border-radius: 6px;
            padding: 8px 10px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .section-label {
            font-size: 0.7rem;
            font-weight: 900;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .preset-grid { display: grid; gap: 4px; margin-bottom: 6px; }
        .preset-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
        .preset-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
        .preset-grid.cols-8 { grid-template-columns: repeat(4, 1fr); }
        .preset-grid.cols-7 { grid-template-columns: repeat(7, 1fr); }

        .pill-btn {
            border: 1px solid #cbd5e1;
            background: rgba(255, 255, 255, 0.85);
            color: #475569;
            font-size: 0.64rem;
            font-weight: 800;
            padding: 4px 2px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.12s ease;
            text-align: center;
            white-space: nowrap;
        }
        .pill-btn:hover { border-color: #0284c7; color: #0284c7; background: #f0f9ff; }
        .pill-btn.active {
            background: #0284c7 !important;
            color: #ffffff !important;
            border-color: #0284c7 !important;
            box-shadow: 0 1px 4px rgba(2, 132, 199, 0.2);
        }

        /* 显眼的运动开关按钮 */
        .btn-move-toggle {
            font-size: 0.68rem;
            font-weight: 900;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1.5px solid #cbd5e1;
            background: rgba(255, 255, 255, 0.9);
            color: #64748b;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-move-toggle:hover {
            border-color: #0284c7;
            color: #0284c7;
        }
        .btn-move-toggle.active-move {
            background: #22c55e !important;
            border-color: #16a34a !important;
            color: #ffffff !important;
            box-shadow: 0 2px 8px rgba(34, 197, 94, 0.35) !important;
        }

        .ctrl-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .ctrl-row:last-child { margin-bottom: 0; }
        .ctrl-row label {
            font-size: 0.68rem;
            font-weight: 700;
            color: #475569;
            width: 84px;
            flex-shrink: 0;
        }
        .ctrl-row input[type="range"] {
            flex: 1;
            accent-color: #0284c7;
            cursor: pointer;
            height: 4px;
            min-width: 50px;
        }
        .stepper-box {
            display: flex;
            align-items: center;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            overflow: hidden;
            background: #ffffff;
        }
        .step-btn {
            width: 19px;
            height: 22px;
            border: none;
            background: #f8fafc;
            color: #0284c7;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.1s;
        }
        .step-btn:hover { background: #e0f2fe; }
        .num-input {
            width: 54px;
            height: 22px;
            border: none;
            border-left: 1px solid #e2e8f0;
            border-right: 1px solid #e2e8f0;
            font-family: inherit;
            font-size: 0.72rem;
            font-weight: 800;
            text-align: center;
            color: #0284c7;
            outline: none;
            background: #ffffff;
        }

        .divider {
            height: 1px;
            background: rgba(226, 232, 240, 0.9);
            margin: 8px 0;
            border-radius: 1px;
        }

        .move-subbox {
            background: rgba(2, 132, 199, 0.04);
            border-left: 2.5px solid #0284c7;
            padding: 6px 8px;
            border-radius: 0 4px 4px 0;
            margin-top: 6px;
        }
        .hint-speed-formula {
            font-size: 0.58rem;
            color: #0284c7;
            margin-top: 2px;
            font-weight: 600;
            line-height: 1.3;
        }

        .swatches-grid-9 {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 3px;
            margin-top: 2px;
        }
        .round-swatch-btn {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.1s;
            flex-shrink: 0;
        }
        .round-swatch-btn:hover { transform: scale(1.2); border-color: #0284c7; }
        .round-swatch-btn.active {
            border-color: #0284c7;
            box-shadow: 0 0 0 2px #0284c7, 0 0 0 3px rgba(2, 132, 199, 0.2);
            transform: scale(1.1);
        }

        .btn-start {
            width: 100%;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 10px;
            font-size: 0.9rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 4px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
            letter-spacing: 0.5px;
        }
        .btn-start:hover {
            background: linear-gradient(135deg, #0369a1, #075985);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 2px;
        }
        .btn-action {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid #cbd5e1;
            font-size: 0.68rem;
            font-weight: 800;
            color: #475569;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-action:hover {
            border-color: #0284c7;
            color: #0284c7;
            background: #f0f9ff;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>

    <div id="top-hud">
        <div class="hud-card">
            <div>DPI: <span class="hud-val" id="hud-dpi">800</span></div>
            <div>CM/360°: <span class="hud-val" id="hud-cm">50.00</span>cm</div>
            <div>FOV: <span class="hud-val" id="hud-fov">103</span>°</div>
            <div>视角水平角: <span class="hud-val" id="hud-angle">0.000</span>°</div>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
            <div class="hud-card f11-card f11-highlight" id="f11-box">F11全屏</div>
            <div class="hud-card"><div>FPS: <span class="fps-val" id="hud-fps">--</span></div></div>
        </div>
    </div>

    <a href="https://space.bilibili.com/1534330" target="_blank" id="author-card" title="点击访问作者B站空间">
        <div class="author-avatar-badge">海</div>
        <div class="author-meta"><span class="author-name">作者：西岛海</span><span class="author-tag">xlm</span></div>
    </a>

    <div id="bottom-right-hud">
        <div class="rel-title">物理精算映射原理 (底层互通)</div>
        <div class="rel-formula">360°总点数 N = (cm ÷ 2.54) × DPI<br />鼠标单点弧度 Δθ = 2π / N</div>
        <div class="rel-desc">• <strong>DPI</strong> 为采样率；<strong>CM/360°</strong> 为物理位移标定。<br />• 初始状态假人头部严格锁定视平线 $1.625\text{m}$，准星直指正中眉心。</div>
    </div>

    <div id="canvas-container"></div>

    <div id="draggable-panel">
        <div class="glass-panel" id="panel-col-1">
            <div class="panel-header" id="panel-handle">
                <span class="panel-title">测验台【支持滚轮微调】</span>
                <div class="header-actions">
                    <button class="header-btn" id="btn-theme-toggle">日落暮色</button>
                    <button class="header-btn" id="btn-drag-toggle">移动窗口</button>
                </div>
            </div>

            <!-- 形态切换 -->
            <div class="section-card">
                <div class="section-header">
                    <span class="section-label">🎯 目标形态切换</span>
                </div>
                <div class="preset-grid cols-2">
                    <button class="pill-btn" id="btn-type-sphere" onclick="setTargetShape('sphere')">小球标靶</button>
                    <button class="pill-btn active" id="btn-type-dummy" onclick="setTargetShape('dummy')">高精人偶假人</button>
                </div>
            </div>

            <!-- 物理外设标定（割线严格分隔） -->
            <div class="section-card">
                <div class="section-header">
                    <span class="section-label">🖱️ 物理外设与灵敏度</span>
                </div>

                <!-- 1. 鼠标 DPI -->
                <div class="preset-grid cols-8" id="dpi-presets">
                    <button class="pill-btn dpi-pill" data-val="200">200</button>
                    <button class="pill-btn dpi-pill" data-val="400">400</button>
                    <button class="pill-btn dpi-pill active" data-val="800">800</button>
                    <button class="pill-btn dpi-pill" data-val="1000">1000</button>
                    <button class="pill-btn dpi-pill" data-val="1200">1200</button>
                    <button class="pill-btn dpi-pill" data-val="1600">1600</button>
                    <button class="pill-btn dpi-pill" data-val="2400">2400</button>
                    <button class="pill-btn dpi-pill" data-val="3200">3200</button>
                </div>
                <div class="ctrl-row">
                    <label>鼠标 DPI</label>
                    <input type="range" id="inp-dpi-r" min="50" max="6400" step="50" value="800" />
                    <div class="stepper-box">
                        <button class="step-btn" onclick="stepValGlobal('inp-dpi', -50)">−</button>
                        <input type="number" class="num-input" id="inp-dpi" value="800" min="50" max="32000" step="1" />
                        <button class="step-btn" onclick="stepValGlobal('inp-dpi', 50)">+</button>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- 2. CM / 360° -->
                <div class="preset-grid cols-7">
                    <button class="pill-btn cm-pill" data-val="25">25</button>
                    <button class="pill-btn cm-pill active" data-val="50">50</button>
                    <button class="pill-btn cm-pill" data-val="55">55</button>
                    <button class="pill-btn cm-pill" data-val="65">65</button>
                    <button class="pill-btn cm-pill" data-val="75">75</button>
                    <button class="pill-btn cm-pill" data-val="85">85</button>
                    <button class="pill-btn cm-pill" data-val="100">100</button>
                </div>
                <div class="ctrl-row">
                    <label>CM / 360°</label>
                    <input type="range" id="inp-cm-r" min="1" max="1000" step="1" value="189" />
                    <div class="stepper-box">
                        <button class="step-btn" onclick="stepValGlobal('inp-cm', -0.25)">−</button>
                        <input type="number" class="num-input" id="inp-cm" value="50.00" min="0.1" max="10000" step="0.01">
                        <button class="step-btn" onclick="stepValGlobal('inp-cm', 0.25)">+</button>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- 3. 水平 FOV -->
                <div class="preset-grid cols-4">
                    <button class="pill-btn" id="btn-fov-10" onclick="syncFov(10)">10°</button>
                    <button class="pill-btn" id="btn-fov-60" onclick="syncFov(60)">60°</button>
                    <button class="pill-btn" id="btn-fov-90" onclick="syncFov(90)">90°</button>
                    <button class="pill-btn active" id="btn-fov-103" onclick="syncFov(103)">103°</button>
                </div>
                <div class="ctrl-row">
                    <label>水平 FOV</label>
                    <input type="range" id="inp-fov-r" min="10" max="140" step="1" value="103" />
                    <div class="stepper-box">
                        <button class="step-btn" onclick="stepValGlobal('inp-fov', -1)">−</button>
                        <input type="number" class="num-input" id="inp-fov" value="103.00" step="0.5" />
                        <button class="step-btn" onclick="stepValGlobal('inp-fov', 1)">+</button>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- 4. 玩家视高 -->
                <div class="ctrl-row">
                    <label>玩家视高 (m)</label>
                    <input type="range" id="inp-height-r" min="0.5" max="3.0" step="0.005" value="1.625" />
                    <div class="stepper-box">
                        <button class="step-btn" onclick="stepValGlobal('inp-height', -0.025)">−</button>
                        <input type="number" class="num-input" id="inp-height" value="1.625" min="0.5" max="3.0" step="0.005" />
                        <button class="step-btn" onclick="stepValGlobal('inp-height', 0.025)">+</button>
                    </div>
                </div>
            </div>

            <!-- 准星设置 -->
            <div class="section-card">
                <div class="section-header">
                    <span class="section-label">🎨 准星调色</span>
                    <label style="margin-left:auto;display:flex;align-items:center;gap:3px;cursor:pointer;font-size:0.62rem;color:#0284c7;font-weight:bold;">
                        <input type="checkbox" id="inp-custom-crosshair" /> 自定义颜色
                    </label>
                </div>
                <div id="crosshair-custom-box" class="move-subbox" style="display:none;">
                    <div style="font-size:0.62rem;font-weight:bold;color:#475569;margin-bottom:2px;">默认静止准星颜色:</div>
                    <div class="swatches-grid-9" id="swatches-default"></div>
                    <div style="font-size:0.62rem;font-weight:bold;color:#475569;margin-top:6px;margin-bottom:2px;">瞄准命中高亮颜色:</div>
                    <div class="swatches-grid-9" id="swatches-target"></div>
                </div>
            </div>

            <div id="targets-container-1"></div>

            <div class="action-grid">
                <button class="btn-action" onclick="addNewTarget()">➕ 添加新目标</button>
                <button class="btn-action" onclick="removeLastTarget()" style="color:#ef4444;">➖ 删除末尾目标</button>
            </div>

            <button class="btn-start" id="btn-lock">进入靶场 (锁定鼠标)</button>
        </div>

        <div class="glass-panel" id="panel-col-2" style="display:none;">
            <div class="panel-header"><span class="panel-title">超量目标控制</span></div>
            <div id="targets-container-2"></div>
        </div>
    </div>

    <script>
        // =============================================================
        //  1. 全局配置 & 物理数学库
        // =============================================================
        const ISO_INCH_TO_CM = 2.54;

        const COLOR_PRESETS_CROSSHAIR = [
            { name: '黑', hex: '#000000' }, { name: '白', hex: '#ffffff' }, { name: '赤', hex: '#ef4444' },
            { name: '橙', hex: '#f97316' }, { name: '黄', hex: '#eab308' }, { name: '绿', hex: '#22c55e' },
            { name: '青', hex: '#06b6d4' }, { name: '蓝', hex: '#3b82f6' }, { name: '紫', hex: '#a855f7' }
        ];

        let config = {
            dpi: 800,
            cmPer360: 50.0,
            fovHorizontal: 103,
            theme: 'day',
            targetShape: 'dummy',
            customCrosshair: { enabled: false, defaultColor: '#000000', targetColor: '#0284c7' },
            targets: [],
            viewHeight: 1.625
        };

        const PRESET_COLORS = ['#ea580c', '#0284c7', '#10b981', '#8b5cf6', '#f43f5e', '#f59e0b', '#14b8a6', '#ec4899', '#06b6d4'];

        let radiansPerCount = 0.0;
        let totalCounts360 = 0;

        function updateSensitivity() {
            totalCounts360 = (config.cmPer360 / ISO_INCH_TO_CM) * config.dpi;
            radiansPerCount = (Math.PI * 2) / Math.max(1, totalCounts360);
            document.getElementById('hud-dpi').innerText = config.dpi;
            document.getElementById('hud-cm').innerText = config.cmPer360.toFixed(2);
            document.getElementById('hud-fov').innerText = Math.round(config.fovHorizontal);
            document.querySelectorAll('.dpi-pill').forEach(b => b.classList.toggle('active', parseInt(b.dataset.val) === config.dpi));
            document.querySelectorAll('.cm-pill').forEach(b => b.classList.toggle('active', Math.abs(parseFloat(b.dataset.val) - config.cmPer360) < 0.01));
        }

        function hFovToVfov(hFov, aspect) {
            const hRad = (hFov * Math.PI) / 180;
            const vRad = 2 * Math.atan(Math.tan(hRad / 2) / aspect);
            return (vRad * 180) / Math.PI;
        }

        // =============================================================
        //  2. 音效系统
        // =============================================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playHitFeedback(part) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            const freq = (part === 'head') ? 1250 : 880;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq + 400, audioCtx.currentTime + 0.06);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.07);
        }

        // =============================================================
        //  3. Three.js 场景与环境
        // =============================================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(0, config.viewHeight, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        function createSkyTexture(theme) {
            const c = document.createElement('canvas');
            c.width = 16;
            c.height = 1024;
            const ctx = c.getContext('2d');
            const g = ctx.createLinearGradient(0, 0, 0, 1024);
            if (theme === 'day') {
                g.addColorStop(0.0, '#003bf3');
                g.addColorStop(0.22, '#1d4ed8');
                g.addColorStop(0.50, '#38bdf8');
                g.addColorStop(0.80, '#bae6fd');
                g.addColorStop(0.95, '#f0f9ff');
                g.addColorStop(1.0, '#ffffff');
            } else {
                g.addColorStop(0.0, '#312e81');
                g.addColorStop(0.35, '#6366f1');
                g.addColorStop(0.65, '#f43f5e');
                g.addColorStop(0.85, '#fdba74');
                g.addColorStop(1.0, '#fff7ed');
            }
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 16, 1024);
            return new THREE.CanvasTexture(c);
        }
        const skyGeo = new THREE.SphereGeometry(180, 32, 16);
        const skyMat = new THREE.MeshBasicMaterial({ map: createSkyTexture('day'), side: THREE.BackSide });
        const skyMesh = new THREE.Mesh(skyGeo, skyMat);
        scene.add(skyMesh);

        const cloudGroup = new THREE.Group();
        scene.add(cloudGroup);
        const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.62, depthWrite: false });
        for (let i = 0; i < 36; i++) {
            const x = (Math.random() - 0.5) * 240,
                  z = (Math.random() - 0.5) * 240,
                  y = 42 + Math.random() * 24;
            const w = 14 + Math.random() * 24,
                  h = 0.8 + Math.random() * 0.6,
                  d = 8 + Math.random() * 16;
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), cloudMat);
            m.position.set(x, y, z);
            m.userData = { speedX: 0.4 + Math.random() * 0.35 };
            cloudGroup.add(m);
        }

        const ambientLight = new THREE.HemisphereLight(0xffffff, 0xe2e8f0, 0.95);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.7);
        sunLight.position.set(30, 60, 30);
        sunLight.castShadow = true;
        scene.add(sunLight);

        const floorGeo = new THREE.PlaneGeometry(300, 300);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.1, metalness: 0.02 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);
        const grid = new THREE.GridHelper(300, 150, 0x94a3b8, 0xe2e8f0);
        grid.position.y = 0.001;
        scene.add(grid);

        let horizonLine, thinLine;
        function updateHorizon(height) {
            if (horizonLine) scene.remove(horizonLine);
            if (thinLine) scene.remove(thinLine);
            const radius = 48;
            const pts = [];
            const segs = 72;
            for (let i = 0; i <= segs; i++) {
                const theta = (i / segs) * Math.PI * 2;
                pts.push(new THREE.Vector3(radius * Math.cos(theta), height, radius * Math.sin(theta)));
            }
            const geo = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineDashedMaterial({
                color: 0xffffff,
                dashSize: 0.45,
                gapSize: 0.3,
                transparent: true,
                opacity: 0.5
            });
            horizonLine = new THREE.Line(geo, mat);
            horizonLine.computeLineDistances();
            scene.add(horizonLine);
            const thinMat = new THREE.LineBasicMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.15 });
            thinLine = new THREE.Line(geo.clone(), thinMat);
            scene.add(thinLine);
        }
        updateHorizon(config.viewHeight);

        const compassGroup = new THREE.Group();
        scene.add(compassGroup);

        function createUltraSharpSprite(text, isMain) {
            const c = document.createElement('canvas');
            c.width = 512;
            c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = isMain ? 'rgba(15,23,42,0.92)' : 'rgba(255,255,255,0.92)';
            ctx.beginPath();
            ctx.roundRect(32, 48, 448, 160, 40);
            ctx.fill();
            ctx.strokeStyle = isMain ? '#0284c7' : '#94a3b8';
            ctx.lineWidth = 10;
            ctx.stroke();
            ctx.fillStyle = isMain ? '#ffffff' : '#0f172a';
            ctx.font = isMain ? 'bold 80px sans-serif' : 'bold 70px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 256, 128);
            const tex = new THREE.CanvasTexture(c);
            tex.minFilter = THREE.LinearFilter;
            tex.magFilter = THREE.LinearFilter;
            const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
            const sp = new THREE.Sprite(mat);
            sp.scale.set(isMain ? 4.8 : 3.8, isMain ? 2.4 : 1.9, 1);
            return sp;
        }

        for (let deg = 0; deg < 360; deg += 22.5) {
            const rad = (deg * Math.PI) / 180;
            const x = 48 * Math.sin(rad), z = -48 * Math.cos(rad);
            const isCardinal = (deg % 90 === 0), isSemi = (deg % 45 === 0);
            const lm = new THREE.LineBasicMaterial({ color: isCardinal ? 0x0284c7 : (isSemi ? 0x64748b : 0x94a3b8), linewidth: isCardinal ? 2 : 1 });
            const pts = [new THREE.Vector3(x, 0.01, z), new THREE.Vector3(x, isCardinal ? 5.5 : (isSemi ? 4.0 : 2.5), z)];
            compassGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lm));
            let label = deg + '°';
            if (deg === 0) label = '0° (前)';
            else if (deg === 90) label = '90° (右)';
            else if (deg === 180) label = '180° (后)';
            else if (deg === 270) label = '270° (左)';
            const sp = createUltraSharpSprite(label, isCardinal);
            sp.position.set(x, isCardinal ? 7.0 : (isSemi ? 5.2 : 3.6), z);
            compassGroup.add(sp);
        }

        // =============================================================
        //  4. 假人与标靶几何体（严格保持原版基准 & 接地平齐）
        // =============================================================
        const sphereGeo = new THREE.SphereGeometry(1, 48, 48);

        function rebuildMannequinMesh(t) {
            while (t.dummyGroup.children.length > 0) {
                const obj = t.dummyGroup.children[0];
                if (obj.geometry) obj.geometry.dispose();
                t.dummyGroup.remove(obj);
            }

            const headRadiusX = (t.headWidthCm / 100) / 2;
            const headRadiusY = (t.headHeightCm / 100) / 2;
            const bodyWidth = t.bodyWidthCm / 100;
            const bodyHeight = t.bodyHeightCm / 100;
            const bodyDepth = Math.max(0.15, bodyWidth * (2.2 / 3.38));
            const neckGap = (t.neckGapCm || 6.325) / 100;

            // 头部 (以头部中心为原点 (0, 0, 0))
            const headMat = new THREE.MeshStandardMaterial({ color: t.color, roughness: 0.25 });
            const headGeo = new THREE.SphereGeometry(1, 32, 32);
            const head = new THREE.Mesh(headGeo, headMat);
            head.scale.set(headRadiusX, headRadiusY, headRadiusX);
            head.position.set(0, 0, 0);
            head.castShadow = true;
            head.userData.part = 'head';
            t.dummyGroup.add(head);

            // 颈部衣领虚线
            const dashPts = [];
            const rx = headRadiusX * 1.01;
            const ry = headRadiusY;
            for (let a = -Math.PI * 0.05; a >= -Math.PI * 0.95; a -= 0.04) {
                dashPts.push(new THREE.Vector3(rx * Math.cos(a), ry * Math.sin(a), headRadiusX * 1.01));
            }
            const dashGeo = new THREE.BufferGeometry().setFromPoints(dashPts);
            const dashMat = new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.02, gapSize: 0.015, linewidth: 2 });
            const dashLine = new THREE.Line(dashGeo, dashMat);
            dashLine.computeLineDistances();
            dashLine.userData.ignoreRaycast = true;
            t.dummyGroup.add(dashLine);

            // 身体
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.65 });
            const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.0, 24);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.scale.set(bodyWidth, bodyHeight, bodyDepth);
            body.position.set(0, -(neckGap + bodyHeight / 2), 0);
            body.castShadow = true;
            body.userData.part = 'body';
            t.dummyGroup.add(body);
        }

        function createSphereTarget(colorStr) {
            const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(colorStr), roughness: 0.25 });
            const mesh = new THREE.Mesh(sphereGeo, mat);
            mesh.castShadow = true;
            mesh.userData.part = 'body';
            return mesh;
        }

        function setTargetShape(shape) {
            config.targetShape = shape;
            document.getElementById('btn-type-sphere').classList.toggle('active', shape === 'sphere');
            document.getElementById('btn-type-dummy').classList.toggle('active', shape === 'dummy');
            updateScene();
            rebuildTargetUI();
        }

        function updateScene() {
            const isSphere = config.targetShape === 'sphere';
            const isDummy = config.targetShape === 'dummy';

            config.targets.forEach(t => {
                t.sphereMesh.visible = isSphere;
                t.dummyGroup.visible = isDummy;

                if (isSphere) {
                    const r = (t.sizeCm / 100) / 2;
                    t.sphereMesh.scale.set(r, r, r);
                    t.rootGroup.position.y = config.viewHeight + (t.yOffset || 0);
                } else {
                    const bodyH = t.bodyHeightCm / 100;
                    const neckGap = (t.neckGapCm || 6.325) / 100;
                    const groundBaseY = neckGap + bodyH;
                    t.rootGroup.position.y = groundBaseY + (t.yOffset || 0);
                }
            });

            camera.position.y = config.viewHeight;
            camera.fov = hFovToVfov(config.fovHorizontal, window.innerWidth / window.innerHeight);
            camera.updateProjectionMatrix();
            updateHorizon(config.viewHeight);
        }

        // =============================================================
        //  5. 视角旋转 & 准星系统（白天默认黑，瞄准高亮）
        // =============================================================
        let yaw = 0.0, pitch = 0.0;
        const cameraEuler = new THREE.Euler(0, 0, 0, 'YXZ');

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                const mx = e.movementX, my = e.movementY;
                if (Math.abs(mx) > 1200 || Math.abs(my) > 1200) return;
                yaw -= mx * radiansPerCount;
                pitch -= my * radiansPerCount;
                pitch = Math.max(-Math.PI / 2 + 0.001, Math.min(Math.PI / 2 - 0.001, pitch));
                yaw = yaw % (Math.PI * 2);
                cameraEuler.set(pitch, yaw, 0);
                camera.quaternion.setFromEuler(cameraEuler);
            }
        });

        const raycaster = new THREE.Raycaster();
        const centerVec = new THREE.Vector2(0, 0);
        const crosshairEl = document.getElementById('crosshair');
        let currentCrosshairColor = '';
        let currentOnTargetState = false;

        function updateCrosshairUI(onTarget) {
            let color;
            if (config.customCrosshair.enabled) {
                color = onTarget ? config.customCrosshair.targetColor : config.customCrosshair.defaultColor;
            } else {
                const isSunset = config.theme === 'sunset';
                color = onTarget ? (isSunset ? '#38bdf8' : '#0284c7') : (isSunset ? '#ffffff' : '#000000');
            }

            if (color !== currentCrosshairColor) {
                currentCrosshairColor = color;
                document.documentElement.style.setProperty('--crosshair-color', color);
            }

            if (onTarget !== currentOnTargetState) {
                currentOnTargetState = onTarget;
                crosshairEl.classList.toggle('on-target', onTarget);
            }
        }

        const activeRaycastObjects = [];

        function checkAim() {
            if (document.pointerLockElement !== document.body) {
                updateCrosshairUI(false);
                return null;
            }
            raycaster.setFromCamera(centerVec, camera);
            activeRaycastObjects.length = 0;
            const isSphere = (config.targetShape === 'sphere');

            for (let i = 0; i < config.targets.length; i++) {
                const t = config.targets[i];
                if (isSphere) {
                    if (t.sphereMesh.visible) activeRaycastObjects.push(t.sphereMesh);
                } else {
                    if (t.dummyGroup.visible) {
                        t.dummyGroup.children.forEach(child => {
                            if (child.isMesh && child.userData.part && !child.userData.ignoreRaycast) {
                                activeRaycastObjects.push(child);
                            }
                        });
                    }
                }
            }

            const intersects = raycaster.intersectObjects(activeRaycastObjects, false);
            if (intersects.length > 0) {
                updateCrosshairUI(true);
                let hitTarget = null;
                let hitPart = 'body';
                const hitObject = intersects[0].object;

                for (let i = 0; i < config.targets.length; i++) {
                    const t = config.targets[i];
                    if (t.rootGroup === hitObject.parent || t.rootGroup === hitObject.parent?.parent) {
                        hitTarget = t;
                        break;
                    }
                }
                if (hitTarget) {
                    if (hitObject.userData.part) hitPart = hitObject.userData.part;
                    return { target: hitTarget, part: hitPart, object: hitObject };
                }
                return null;
            } else {
                updateCrosshairUI(false);
                return null;
            }
        }

        window.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement === document.body && e.button === 0) {
                const hitResult = checkAim();
                if (hitResult) {
                    const { target, part } = hitResult;
                    playHitFeedback(part);
                    if (part === 'head') {
                        const headMesh = target.dummyGroup.children.find(c => c.userData.part === 'head' && c.isMesh);
                        if (headMesh) {
                            const origColor = headMesh.material.color.getHex();
                            headMesh.material.color.setHex(0xffffff);
                            setTimeout(() => { headMesh.material.color.setHex(origColor); }, 80);
                        }
                    } else {
                        const base = target.rootGroup.scale.x;
                        target.rootGroup.scale.setScalar(base * 1.18);
                        setTimeout(() => target.rootGroup.scale.setScalar(base), 70);
                    }
                }
            }
        });

        // =============================================================
        //  6. 动态多目标管理与 UI 绑定
        // =============================================================
        const container1 = document.getElementById('targets-container-1');
        const container2 = document.getElementById('targets-container-2');
        const col2 = document.getElementById('panel-col-2');

        function rebuildTargetUI() {
            container1.innerHTML = '';
            container2.innerHTML = '';
            const isDummy = config.targetShape === 'dummy';

            config.targets.forEach((t, i) => {
                const card = document.createElement('div');
                card.className = 'section-card';
                card.style.marginTop = '6px';

                let dimensionControlsHTML = '';
                if (isDummy) {
                    dimensionControlsHTML = `
                        <div class="ctrl-row">
                            <label>等比总缩放 (cm)</label>
                            <input type="range" id="inp-t${i}-s-r" min="5" max="150" step="0.5" value="${t.sizeCm}" />
                            <div class="stepper-box">
                                <button class="step-btn" id="btn-t${i}-s-minus">−</button>
                                <input type="number" class="num-input" id="inp-t${i}-s" value="${t.sizeCm.toFixed(1)}" step="0.5" />
                                <button class="step-btn" id="btn-t${i}-s-plus">+</button>
                            </div>
                        </div>
                        <div class="ctrl-row">
                            <label>头部宽/高(cm)</label>
                            <div class="stepper-box" style="flex:1;">
                                <button class="step-btn" id="btn-t${i}-hw-minus">−</button>
                                <input type="number" class="num-input" style="flex:1;width:auto;" id="inp-t${i}-hw" value="${t.headWidthCm.toFixed(1)}" step="0.5" title="头宽" />
                                <button class="step-btn" id="btn-t${i}-hw-plus">+</button>
                            </div>
                            <div class="stepper-box" style="flex:1;">
                                <button class="step-btn" id="btn-t${i}-hh-minus">−</button>
                                <input type="number" class="num-input" style="flex:1;width:auto;" id="inp-t${i}-hh" value="${t.headHeightCm.toFixed(1)}" step="0.5" title="头高" />
                                <button class="step-btn" id="btn-t${i}-hh-plus">+</button>
                            </div>
                        </div>
                        <div class="ctrl-row">
                            <label>身体宽/高(cm)</label>
                            <div class="stepper-box" style="flex:1;">
                                <button class="step-btn" id="btn-t${i}-bw-minus">−</button>
                                <input type="number" class="num-input" style="flex:1;width:auto;" id="inp-t${i}-bw" value="${t.bodyWidthCm.toFixed(1)}" step="1" title="身宽" />
                                <button class="step-btn" id="btn-t${i}-bw-plus">+</button>
                            </div>
                            <div class="stepper-box" style="flex:1;">
                                <button class="step-btn" id="btn-t${i}-bh-minus">−</button>
                                <input type="number" class="num-input" style="flex:1;width:auto;" id="inp-t${i}-bh" value="${t.bodyHeightCm.toFixed(1)}" step="1" title="身高" />
                                <button class="step-btn" id="btn-t${i}-bh-plus">+</button>
                            </div>
                        </div>
                    `;
                } else {
                    dimensionControlsHTML = `
                        <div class="ctrl-row">
                            <label>球体大小 (cm)</label>
                            <input type="range" id="inp-t${i}-s-r" min="1" max="150" step="0.5" value="${t.sizeCm}" />
                            <div class="stepper-box">
                                <button class="step-btn" id="btn-t${i}-s-minus">−</button>
                                <input type="number" class="num-input" id="inp-t${i}-s" value="${t.sizeCm.toFixed(2)}" step="0.5" />
                                <button class="step-btn" id="btn-t${i}-s-plus">+</button>
                            </div>
                        </div>
                    `;
                }

                // 显眼的运动开关按钮 + 角速度/角跨度界面
                card.innerHTML = `
                    <div class="section-header">
                        <span class="section-label" style="color:${t.color};">🎯 目标 ${t.id} ${isDummy ? '(假人)' : '(球靶)'}</span>
                        <button class="btn-move-toggle ${t.move.enabled ? 'active-move' : ''}" id="btn-t${i}-move-toggle">
                            ${t.move.enabled ? '⚡ 运动: 开启' : '🔘 运动: 关闭'}
                        </button>
                    </div>

                    ${dimensionControlsHTML}

                    <div class="ctrl-row">
                        <label>前后距离 (m)</label>
                        <input type="range" id="inp-t${i}-z-r" min="1" max="50" step="0.5" value="${t.distMeters}" />
                        <div class="stepper-box">
                            <button class="step-btn" id="btn-t${i}-z-minus">−</button>
                            <input type="number" class="num-input" id="inp-t${i}-z" value="${t.distMeters.toFixed(2)}" step="0.5" />
                            <button class="step-btn" id="btn-t${i}-z-plus">+</button>
                        </div>
                    </div>
                    <div class="ctrl-row">
                        <label>左右方位 (°)</label>
                        <input type="range" id="inp-t${i}-a-r" min="-90" max="90" step="0.5" value="${t.centerDeg}" />
                        <div class="stepper-box">
                            <button class="step-btn" id="btn-t${i}-a-minus">−</button>
                            <input type="number" class="num-input" id="inp-t${i}-a" value="${t.centerDeg.toFixed(2)}" step="0.5" />
                            <button class="step-btn" id="btn-t${i}-a-plus">+</button>
                        </div>
                    </div>
                    <div class="ctrl-row">
                        <label>上下微调 (m)</label>
                        <input type="range" id="inp-t${i}-y-r" min="-2" max="4" step="0.05" value="${t.yOffset || 0}" />
                        <div class="stepper-box">
                            <button class="step-btn" id="btn-t${i}-y-minus">−</button>
                            <input type="number" class="num-input" id="inp-t${i}-y" value="${(t.yOffset || 0).toFixed(2)}" step="0.05" />
                            <button class="step-btn" id="btn-t${i}-y-plus">+</button>
                        </div>
                    </div>

                    <!-- 运动控制子面板 (全部统一为角速度 °/s 与 角跨度 °) -->

        function updateTargetSpeedHint(t, i) {
            const hint = document.getElementById(`lbl-t${i}-hint`);
            if (!hint) return;
            const D = t.distMeters;
            const linearSpeed = D * (t.move.speedDeg * Math.PI / 180);
            const linearSpan = 2 * D * Math.tan((t.move.totalSpanDeg / 2) * Math.PI / 180);
            if (t.move.mode === 'linear') {
                hint.innerHTML = `• 平面直线折返：当前 ${D.toFixed(1)}m 对应中心线速 ≈ <strong>${linearSpeed.toFixed(2)} m/s</strong>，直线行程 ≈ <strong>${linearSpan.toFixed(2)} m</strong>`;
            } else {
                hint.innerHTML = `• 弧形围绕巡航：当前 ${D.toFixed(1)}m 对应弧线速度 ≈ <strong>${linearSpeed.toFixed(2)} m/s</strong>`;
            }
        }

        function removeLastTarget() {
            if (config.targets.length <= 1) { alert("至少需保留一个目标用以练习！"); return; }
            const t = config.targets.pop();
            t.rootGroup.traverse(child => {
                if (child.geometry) child.geometry.dispose();

        function bindSyncGlobal(idRange, idNum, key, parent = config, isCm = false) {

                num.value = val.toFixed(2);
                parent[key] = val;
                updateSensitivity();

        // =============================================================
        //  8. 物理横移/围绕运动引擎 (统一基于角速度 & 角跨度运算)
        // =============================================================
        let lastTime = performance.now(), lastFrame = performance.now(), frameCnt = 0;
        const hudFps = document.getElementById('hud-fps');
        const hudAngle = document.getElementById('hud-angle');
        let lastRenderedAngle = -999;

        function updatePhysics(dt) {
            cloudGroup.children.forEach(c => {
                c.position.x += c.userData.speedX * dt * 2.5;
                if (c.position.x > 130) c.position.x = -130;
            });

            config.targets.forEach(t => {
                if (!t.rootGroup.visible) return;

                const centerRad = (t.centerDeg * Math.PI) / 180;
                const D = t.distMeters;

                if (t.move.enabled) {
                    if (t.move.mode === 'linear') {
                        // 1. 平面直线横移 (基于角跨度与角速度换算为直线位移)
                        const linearHalfSpan = D * Math.tan((t.move.totalSpanDeg / 2) * Math.PI / 180);
                        const linearSpeed = D * (t.move.speedDeg * Math.PI / 180);

                        t.move.currentLinearOffset += t.move.dir * linearSpeed * dt;
                        if (t.move.currentLinearOffset >= linearHalfSpan) {
                            t.move.currentLinearOffset = linearHalfSpan;
                            t.move.dir = -1;
                        } else if (t.move.currentLinearOffset <= -linearHalfSpan) {
                            t.move.currentLinearOffset = -linearHalfSpan;
                            t.move.dir = 1;
                        }

                        const baseX = D * Math.sin(centerRad);
                        const baseZ = -D * Math.cos(centerRad);
                        const tanX = Math.cos(centerRad);
                        const tanZ = Math.sin(centerRad);

                        t.rootGroup.position.x = baseX + tanX * t.move.currentLinearOffset;
                        t.rootGroup.position.z = baseZ + tanZ * t.move.currentLinearOffset;
                    } else {
                        // 2. 弧形角度围绕
                        const halfDeg = t.move.totalSpanDeg / 2;
                        t.move.currentOffsetDeg += t.move.dir * t.move.speedDeg * dt;
                        if (t.move.currentOffsetDeg >= halfDeg) {
                            t.move.currentOffsetDeg = halfDeg;
                            t.move.dir = -1;
                        } else if (t.move.currentOffsetDeg <= -halfDeg) {
                            t.move.currentOffsetDeg = -halfDeg;
                            t.move.dir = 1;
                        }
                        const curRad = ((t.centerDeg + t.move.currentOffsetDeg) * Math.PI) / 180;
                        t.rootGroup.position.x = D * Math.sin(curRad);
                        t.rootGroup.position.z = -D * Math.cos(curRad);
                    }
                } else {
                    t.rootGroup.position.x = D * Math.sin(centerRad);
                    t.rootGroup.position.z = -D * Math.cos(centerRad);
                }

                if (config.targetShape === 'dummy' && t.dummyGroup.visible) {
                    const dx = camera.position.x - t.rootGroup.position.x;
                    const dz = camera.position.z - t.rootGroup.position.z;
                    t.rootGroup.rotation.y = Math.atan2(dx, dz);
                }
            });
        }

        function animate(now) {
            requestAnimationFrame(animate);
            const dt = Math.min((now - lastFrame) / 1000, 0.1);
            lastFrame = now;
            updatePhysics(dt);

            const currentDeg = ((-yaw * 180 / Math.PI) % 360 + 360) % 360;
            if (Math.abs(currentDeg - lastRenderedAngle) > 0.001) {
                lastRenderedAngle = currentDeg;
                hudAngle.innerText = currentDeg.toFixed(3);
            }

            frameCnt++;
            if (now - lastTime >= 400) {
                hudFps.innerText = Math.round((frameCnt * 1000) / (now - lastTime));
                frameCnt = 0;
                lastTime = now;
            }
            checkAim();
            renderer.render(scene, camera);
        }

        // =============================================================
        //  9. 启动与初始化
        // =============================================================
        (function syncInitialCm() {
            const cmInput = document.getElementById('inp-cm');
            const cmRng = document.getElementById('inp-cm-r');
            const initVal = parseFloat(cmInput.value);
            if (!isNaN(initVal) && initVal > 0) {
                config.cmPer360 = initVal;
                const ratio = Math.pow((initVal - 0.5) / 10000, 1 / 3.2);
                if (cmRng) cmRng.value = Math.round(ratio * 1000);
            }
        })();

        config.viewHeight = 1.625;
        document.getElementById('inp-height-r').value = 1.625;
        document.getElementById('inp-height').value = "1.625";

        initCrosshairColorSwatches();
        addNewTarget(); // A: 0° (正前方，头部中心在 y=1.625)
        addNewTarget(); // B: 20°

        setTargetShape('dummy');
        updateCrosshairUI(false);
        updateSensitivity();
        updateScene();
        animate(performance.now());

        setTimeout(() => {
            const f11Box = document.getElementById('f11-box');
            if (f11Box) f11Box.classList.remove('f11-highlight');
        }, 3000);
    </script>
</body>
