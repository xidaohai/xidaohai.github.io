<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>西岛海表达法 Final - 26.8.20</title>
    <style>
        :root {
            --paper-bg: #d4c4ac;
            --paper-texture: #c7b59a;
            --pencil-blue: #1e3a8a;
            --pencil-purple: #4c1d95;
            --pencil-shadow: rgba(30, 20, 50, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 30px 15px;
            background-color: var(--paper-bg);
            background-image: 
                radial-gradient(var(--paper-texture) 15%, transparent 16%),
                radial-gradient(var(--paper-texture) 15%, transparent 16%);
            background-size: 8px 8px;
            background-position: 0 0, 4px 4px;
            color: var(--pencil-blue);
            font-family: "Microsoft YaHei", "微软雅黑", -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .sketch-card {
            width: 100%;
            max-width: 820px;
            background: #e5d8c5;
            border-radius: 6px;
            padding: 35px 40px;
            box-shadow: 
                0 10px 25px var(--pencil-shadow),
                inset 0 0 80px rgba(160, 130, 90, 0.25);
            position: relative;
            border: 2px solid rgba(120, 100, 70, 0.2);
        }

        .sketch-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 8px;
            background: linear-gradient(to bottom, #dc2626, #d97706, #dc2626);
            border-radius: 6px 0 0 6px;
            opacity: 0.9;
        }

        .header-title {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 25px;
            display: flex;
            align-items: baseline;
            gap: 15px;
            color: var(--pencil-blue);
        }

        .header-title .date { 
            font-size: 1.6rem;
            font-weight: 600;
            opacity: 0.9;
        }

        /* 控制区域：左侧输入 + 右侧跟枪模块 */
        .control-container {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            align-items: stretch;
            flex-wrap: wrap;
        }

        /* 参数输入面板 */
        .input-panel {
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            gap: 12px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px dashed var(--pencil-blue);
            border-radius: 8px;
            padding: 15px 20px;
        }

        .input-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .input-group input {
            width: 90px;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--pencil-blue);
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--pencil-blue);
            text-align: center;
            outline: none;
        }

        /* 右侧独立的高敏/跟枪换算模块 */
        .tracking-module {
            background: rgba(76, 29, 149, 0.05);
            border: 2px solid var(--pencil-purple);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 220px;
        }

        .module-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--pencil-purple);
            margin-bottom: 6px;
        }

        .module-expr {
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--pencil-purple);
            margin-bottom: 8px;
        }

        .calc-btn {
            background: var(--pencil-purple);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .calc-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* 公式卡片整体重构 */
        .formula-card {
            background: rgba(255, 255, 255, 0.3);
            border: 1.5px solid rgba(30, 58, 138, 0.15);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .formula-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .formula-title { 
            font-size: 1.25rem; 
            font-weight: bold; 
            color: #1e293b;
        }
        
        .math-expr { 
            font-size: 1.5rem; 
            font-weight: bold; 
            color: var(--pencil-blue);
        }

        /* 右上角公式得数框 */
        .main-res-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid var(--pencil-blue);
            border-radius: 6px;
            padding: 6px 16px;
            min-width: 140px;
        }

        .res-label { 
            font-size: 0.85rem; 
            font-weight: bold;
            color: #334155;
        }
        
        .res-val { 
            font-size: 1.8rem; 
            font-weight: bold; 
            color: var(--pencil-blue); 
            line-height: 1.1;
            margin-top: 2px;
        }

        /* 左下方四分位框架 */
        .quartile-frame {
            display: inline-flex;
            gap: 0;
            background: rgba(255, 255, 255, 0.4);
            border: 2px dashed var(--pencil-purple);
            border-radius: 6px;
            padding: 6px 8px;
            align-items: center;
            margin-top: 15px;
        }

        .q-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 12px;
        }

        /* 除以 2 高亮深色小方框 */
        .q-item-highlight {
            background: rgba(76, 29, 149, 0.1);
            border-radius: 4px;
            padding: 4px 10px;
        }

        .q-tag { 
            font-size: 0.85rem; 
            font-weight: bold;
            color: var(--pencil-purple); 
        }
        
        .q-val { 
            font-size: 1.4rem; 
            font-weight: bold; 
            color: var(--pencil-purple); 
            line-height: 1.1;
            margin-top: 2px;
        }

        .divider {
            width: 1px;
            height: 32px;
            background: rgba(76, 29, 149, 0.25);
        }

        .footer-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 25px;
            font-size: 0.95rem;
            color: #334155;
        }

        .signature {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--pencil-blue);
        }

        sup { font-size: 0.65em; vertical-align: super; }
    </style>
</head>
<body>

<div class="sketch-card">

    <!-- 标题 -->
    <div class="header-title">
        <span class="date">2026.8.20</span>
        <span>表达法 new</span>
    </div>

    <!-- 控制面板（包含参数输入区 与 右侧跟枪模块） -->
    <div class="control-container">
        <!-- 左侧参数输入区 -->
        <div class="input-panel">
            <div class="input-group">
                <span>x (目标):</span>
                <input type="number" id="input-x" value="2100" step="any" oninput="calculate()">
            </div>
            <div class="input-group">
                <span>y (甩枪):</span>
                <input type="number" id="input-y" value="2100" step="any" oninput="calculate()">
            </div>
            <div class="input-group">
                <span>sl (光腕 cm):</span>
                <input type="number" id="input-sl" value="11.5" step="any" oninput="calculate()">
            </div>
        </div>

        <!-- 右侧高敏/跟枪独立模块 -->
        <div class="tracking-module">
            <div>
                <div class="module-title">【跟枪】/ 高敏优化</div>
                <div class="module-expr">x · ln(y) / ln(x)</div>
            </div>
            <button class="calc-btn" onclick="applyTrackingFormula()">计算结果</button>
        </div>
    </div>

    <!-- 1. 光口法 -->
    <div class="formula-card">
        <div class="card-top">
            <div class="formula-info">
                <span class="formula-title">【光口法】</span>
                <span class="math-expr">S<sup>⅓</sup> · sl<sup>⅔</sup></span>
            </div>
            <div class="main-res-box">
                <span class="res-label">公式得数</span>
                <span class="res-val" id="res-gk">--</span>
            </div>
        </div>
        <div class="quartile-frame">
            <div class="q-item q-item-highlight">
                <span class="q-tag">除以 2</span>
                <span class="q-val" id="gk-half">--</span>
            </div>
            <div class="q-item">
                <span class="q-tag">偏快</span>
                <span class="q-val" id="gk-q1">--</span>
            </div>
            <div class="divider"></div>
            <div class="q-item">
                <span class="q-tag">【四分居中】</span>
                <span class="q-val" id="gk-q2">--</span>
            </div>
            <div class="divider"></div>
            <div class="q-item">
                <span class="q-tag">偏慢</span>
                <span class="q-val" id="gk-q3">--</span>
            </div>
        </div>
    </div>

    <!-- 2. 黄金圆周立方系 -->
    <div class="formula-card">
        <div class="card-top">
            <div class="formula-info">
                <span class="formula-title">【自然法】立方系</span>
                <span class="math-expr">π · Φ · S<sup>⅓</sup></span>
            </div>
            <div class="main-res-box">
                <span class="res-label">公式得数</span>
                <span class="res-val" id="res-cube">--</span>
            </div>
        </div>
        <div class="quartile-frame">
            <div class="q-item q-item-highlight">
                <span class="q-tag">除以 2</span>
                <span class="q-val" id="cube-half">--</span>
            </div>
            <div class="q-item">
                <span class="q-tag">偏快</span>
                <span class="q-val" id="cube-q1">--</span>
            </div>
            <div class="divider"></div>
            <div class="q-item">
                <span class="q-tag">【四分居中】</span>
                <span class="q-val" id="cube-q2">--</span>
            </div>
            <div class="divider"></div>
            <div class="q-item">
                <span class="q-tag">偏慢</span>
                <span class="q-val" id="cube-q3">--</span>
            </div>
        </div>
    </div>

    <!-- 3. 黄金分割指数系 -->
    <div class="formula-card">
        <div class="card-top">
            <div class="formula-info">
                <span class="formula-title">【自然法】黄金系</span>
                <span class="math-expr">π · S<sup>ϕ²</sup></span>
            </div>
            <div class="main-res-box">
                <span class="res-label">公式得数</span>
                <span class="res-val" id="res-gold">--</span>
            </div>
        </div>
        <div class="quartile-frame">
            <div class="q-item q-item-highlight">
                <span class="q-tag">除以 2</span>
                <span class="q-val" id="gold-half">--</span>
            </div>
            <div class="q-item">
                <span class="q-tag">偏快</span>
                <span class="q-val" id="gold-q1">--</span>
            </div>
            <div class="divider"></div>
            <div class="q-item">
                <span class="q-tag">【四分居中】</span>
                <span class="q-val" id="gold-q2">--</span>
            </div>
            <div class="divider"></div>
            <div class="q-item">
                <span class="q-tag">偏慢</span>
                <span class="q-val" id="gold-q3">--</span>
            </div>
        </div>
    </div>

    <!-- 底部落款 -->
    <div class="footer-section">
        <div><strong>S = x + y</strong></div>
        <div class="signature">西岛海 - 表达法</div>
    </div>

</div>

<script>
    const PI = Math.PI;
    const BIG_PHI = (1 + Math.sqrt(5)) / 2;
    const SMALL_PHI = (Math.sqrt(5) - 1) / 2;
    const PHI_SQUARE = SMALL_PHI * SMALL_PHI;

    function renderQuartiles(mainVal, prefix) {
        if (isNaN(mainVal) || mainVal <= 0) {
            document.getElementById(`res-${prefix}`).innerText = "--";
            document.getElementById(`${prefix}-half`).innerText = "--";
            document.getElementById(`${prefix}-q1`).innerText = "--";
            document.getElementById(`${prefix}-q2`).innerText = "--";
            document.getElementById(`${prefix}-q3`).innerText = "--";
            return;
        }

        const half = mainVal / 2;
        const step = (mainVal - half) / 4;
        const q1 = half + step * 1;
        const q2 = half + step * 2;
        const q3 = half + step * 3;

        document.getElementById(`res-${prefix}`).innerText = mainVal.toFixed(2);
        document.getElementById(`${prefix}-half`).innerText = half.toFixed(2);
        document.getElementById(`${prefix}-q1`).innerText = q1.toFixed(2);
        document.getElementById(`${prefix}-q2`).innerText = q2.toFixed(2);
        document.getElementById(`${prefix}-q3`).innerText = q3.toFixed(2);
    }

    function calculate() {
        const x = parseFloat(document.getElementById('input-x').value) || 0;
        const y = parseFloat(document.getElementById('input-y').value) || 0;
        const sl = parseFloat(document.getElementById('input-sl').value) || 0;

        const S = x + y;

        if (S <= 0) {
            renderQuartiles(NaN, 'gk');
            renderQuartiles(NaN, 'cube');
            renderQuartiles(NaN, 'gold');
            return;
        }

        // 1. 光口法
        if (sl > 0) {
            const gkVal = Math.pow(S, 1/3) * Math.pow(sl, 2/3);
            renderQuartiles(gkVal, 'gk');
        } else {
            renderQuartiles(NaN, 'gk');
        }

        // 2. 黄金圆周立方系
        const cubeVal = PI * BIG_PHI * Math.pow(S, 1/3);
        renderQuartiles(cubeVal, 'cube');

        // 3. 黄金分割指数系
        const goldVal = PI * Math.pow(S, PHI_SQUARE);
        renderQuartiles(goldVal, 'gold');
    }

    // 高敏/跟枪公式计算与自动替换函数
    function applyTrackingFormula() {
        const x = parseFloat(document.getElementById('input-x').value) || 0;
        const y = parseFloat(document.getElementById('input-y').value) || 0;

        if (x <= 0 || x === 1 || y <= 0) {
            alert("请输入有效且大于0的 x 和 y (其中 x 不能为 1)");
            return;
        }

        const newX = (x * Math.log(y)) / Math.log(x);

        document.getElementById('input-x').value = newX.toFixed(2);
        document.getElementById('input-y').value = 0;

        calculate();
    }

    calculate();
</script>

</body>
</html>
