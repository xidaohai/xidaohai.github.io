<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>云水僧念佛摄心偈 - 移动端优化3D版</title>
    <style>
        :root {
            --bg-color: #010101;
            --gold: #d4af37;
            --blue: #1E90FF;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: var(--gold);
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", serif;
            overflow: hidden;
            display: flex;
            touch-action: none; /* 防止手机端缩放干扰 */
        }

        /* 西方虚空 */
        .sky {
            position: absolute;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 35%, #1a1000 0%, #050505 50%, #000000 100%);
            z-index: 0;
        }
        #sunset-blur {
            position: absolute;
            top: 35%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw; height: 30vh;
            background: radial-gradient(circle, rgba(255, 140, 0, 0.05) 0%, transparent 70%);
            filter: blur(50px);
            z-index: 1;
            pointer-events: none;
        }

        /* 左上角来源：针对手机端缩小并增加点击反馈 */
        #source-box {
            position: absolute;
            top: 15px; left: 15px;
            width: 200px;
            font-size: 0.65rem;
            line-height: 1.4;
            color: rgba(212, 175, 55, 0.3);
            text-align: justify;
            z-index: 100;
            cursor: pointer;
            padding: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
            transition: all 0.2s;
            max-height: 15vh;
            overflow: hidden;
        }
        #source-box:active {
            background: rgba(212, 175, 55, 0.15);
            color: rgba(212, 175, 55, 0.9);
        }

        /* 右侧挂轴：手机端适配 */
        #poem-right {
            position: absolute;
            right: 15px; top: 50%;
            transform: translateY(-50%);
            writing-mode: vertical-rl;
            font-size: 0.85rem;
            line-height: 2;
            color: rgba(212, 175, 55, 0.3);
            letter-spacing: 0.3em;
            z-index: 10;
            border-right: 1px solid rgba(212, 175, 55, 0.1);
            padding-right: 8px;
        }

        /* 左侧信息：手机端适配 */
        #side-left-container {
            position: absolute;
            left: 15px; top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: row-reverse;
            z-index: 100;
        }
        #phase-left {
            writing-mode: vertical-rl;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 0.4em;
            text-shadow: 0 0 8px currentColor;
        }
        #fragrance-hint {
            writing-mode: vertical-rl;
            font-size: 0.7rem;
            color: rgba(212, 175, 55, 0.4);
            letter-spacing: 0.2em;
            margin-right: 8px;
        }

        /* 3D 舞台：针对手机优化视角 */
        #stage {
            position: absolute;
            width: 100%; height: 100%;
            perspective: 1000px;
            perspective-origin: 50% 35%;
            z-index: 5;
            transform: translateZ(0); 
        }

        /* 底部口部 */
        #mouth-arc {
            position: absolute;
            bottom: -10px; left: 50%;
            transform: translateX(-50%);
            width: 70vw; height: 80px;
            background: radial-gradient(ellipse at center, rgba(212, 175, 55, 0.08) 0%, transparent 75%);
            border-top: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 50% 50% 0 0;
            z-index: 110;
        }

        /* 淡淡的口气香气 */
        .breath-gas {
            position: absolute;
            bottom: 40px; left: 50%;
            width: 80px; height: 80px;
            background: radial-gradient(circle, rgba(255, 255, 245, 0.1) 0%, transparent 70%);
            filter: blur(20px);
            border-radius: 50%;
            opacity: 0;
            z-index: 20;
            animation: breath-rise 5s ease-out forwards;
        }
        @keyframes breath-rise {
            0% { transform: translate3d(-50%, 0, 0) scale(0.6); opacity: 0; }
            20% { opacity: 0.4; }
            100% { transform: translate3d(-50%, -200px, 0) scale(3); opacity: 0; }
        }

        /* 底部佛号：字号优化 */
        #mantra-bottom {
            position: absolute;
            bottom: 8vh; left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 6px;
            opacity: 0;
            z-index: 120;
            transition: opacity 0.8s;
            white-space: nowrap;
        }

        /* 3D 莲华 */
        .lotus-3d-wrap {
            position: absolute;
            left: 50%; bottom: 60px;
            transform-style: preserve-3d;
            will-change: transform, opacity;
            animation: flyToWest 10s ease-in-out forwards;
        }
        
        .lotus-halo {
            position: absolute;
            width: 150px; height: 150px;
            background: radial-gradient(circle, currentColor 0%, transparent 70%);
            opacity: 0.3;
            transform: translate3d(-50%, -50%, -30px);
            left: 50%; top: 50%;
        }

        .lotus-body {
            position: relative;
            transform-style: preserve-3d;
        }

        .petal {
            position: absolute;
            bottom: 0; left: -25px;
            width: 50px; height: 85px;
            transform-origin: bottom center;
            opacity: 0.85;
            backface-visibility: hidden;
            background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, currentColor 70%, rgba(255,255,255,0.8) 100%);
            clip-path: path("M25 85 C35 70 50 55 50 30 C50 10 25 0 25 0 C25 0 0 10 0 30 C0 55 15 70 25 85 Z");
        }

        @keyframes flyToWest {
            0% { transform: translate3d(-50%, 0, 600px) rotateX(25deg); opacity: 0; }
            15% { opacity: 1; transform: translate3d(-50%, -5vh, 300px) rotateX(35deg); }
            100% { transform: translate3d(-50%, -40vh, -6000px) rotateX(85deg); opacity: 0; }
        }

        .fade-in-out { animation: fadeInOut 3.2s forwards; }
        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            15%, 85% { opacity: 0.95; }
        }

        #copy-toast {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(212, 175, 55, 0.95); color: #000;
            padding: 10px 20px; border-radius: 50px; font-weight: bold;
            opacity: 0; transition: 0.3s; z-index: 1000; pointer-events: none;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="sky"></div>
    <div id="sunset-blur"></div>

    <div id="source-box" onclick="copySource()">
        兹录云水僧书壁念佛摄心偈... [点击复制全文]
    </div>

    <div id="side-left-container">
        <div id="phase-left">摄心念佛</div>
        <div id="fragrance-hint">口有莲华香气</div>
    </div>

    <div id="poem-right">
        若问念佛法 摄心自有方<br>
        每念一声佛 口作莲华香<br>
        因我清净心 所以有此香<br>
        华从口中出 朵朵向西方<br>
        一佛华一朵 有色复有光<br>
        念到一声佛 青色放青光<br>
        念到二声佛 黄色放黄光<br>
        念到三声佛 赤色放赤光<br>
        念到四声佛 白色放白光<br>
        如是轮转想 念念不可忘
    </div>

    <div id="stage"></div>
    <div id="mouth-arc"></div>
    <div id="mantra-bottom">南无阿弥陀佛</div>
    <div id="copy-toast">法义已复制</div>

    <script>
        const stage = document.getElementById('stage');
        const phaseLeft = document.getElementById('phase-left');
        const mantraBottom = document.getElementById('mantra-bottom');
        const sourceText = "兹录云水僧书壁念佛摄心偈，似发前人所未发。以之调摄身心，实较其他各法为有效。况念念存想莲华，即西方胜境而安心，自然有助净行，毫无流弊。与势至之都摄六根，净念相继，不谋而合。呈似印公老人，亦赞妙善。故敢钞附于此，俾如（森）驽钝之净业行人，依之修习。";

        const phases = [
            { text: "青色放青光", color: "#1E90FF" },
            { text: "黄色放黄光", color: "#ffee00" },
            { text: "赤色放赤光", color: "#ff3300" },
            { text: "白色放白光", color: "#ffffff" }
        ];

        let count = 0;

        function chant() {
            const current = phases[count % 4];
            
            phaseLeft.innerText = current.text;
            phaseLeft.style.color = current.color;

            mantraBottom.style.color = current.color;
            mantraBottom.style.textShadow = `0 0 10px ${current.color}`;
            mantraBottom.classList.remove('fade-in-out');
            void mantraBottom.offsetWidth; 
            mantraBottom.classList.add('fade-in-out');

            const gas = document.createElement('div');
            gas.className = 'breath-gas';
            document.body.appendChild(gas);
            setTimeout(() => gas.remove(), 5000);

            createMobileLotus(current.color);
            count++;
        }

        function createMobileLotus(color) {
            const wrap = document.createElement('div');
            wrap.className = 'lotus-3d-wrap';
            wrap.style.color = color;

            const halo = document.createElement('div');
            halo.className = 'lotus-halo';
            wrap.appendChild(halo);

            const body = document.createElement('div');
            body.className = 'lotus-body';

            // 移动端保持三层结构，但略微减少瓣膜数以保帧率：6+6+4
            const config = [
                { petals: 6, angle: 70, z: -10, scale: 1.0 },
                { petals: 6, angle: 45, z: 0,   scale: 0.8 },
                { petals: 4, angle: 20, z: 10,  scale: 0.6 }
            ];

            config.forEach(layer => {
                for (let i = 0; i < layer.petals; i++) {
                    const p = document.createElement('div');
                    p.className = 'petal';
                    const rotY = (360 / layer.petals) * i;
                    p.style.transform = `rotateY(${rotY}deg) rotateX(${layer.angle}deg) translate3d(0, 0, ${layer.z}px) scale(${layer.scale})`;
                    body.appendChild(p);
                }
            });

            wrap.appendChild(body);
            stage.appendChild(wrap);
            setTimeout(() => wrap.remove(), 10200);
        }

        function copySource() {
            const fullText = sourceText + "\n\n" + document.getElementById('poem-right').innerText.replace(/<br>/g, "\n");
            navigator.clipboard.writeText(fullText).then(() => {
                const toast = document.getElementById('copy-toast');
                toast.style.opacity = '1';
                setTimeout(() => toast.style.opacity = '0', 2000);
            });
        }

        setInterval(chant, 3800);
        setTimeout(chant, 1000);
    </script>
</body>
</html>
