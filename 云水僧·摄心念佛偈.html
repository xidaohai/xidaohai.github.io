<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云水僧念佛摄心偈 - 极致性能 3D 版</title>
    <style>
        :root {
            --bg-color: #010101;
            --gold: #d4af37;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: var(--gold);
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", serif;
            overflow: hidden;
            display: flex;
            /* 提升全局渲染性能 */
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        /* 西方虚空：夕阳若有若无 */
        .sky {
            position: absolute;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 35%, #1a1000 0%, #050505 50%, #000000 100%);
            z-index: 0;
        }
        #sunset-blur {
            position: absolute;
            top: 35%; left: 50%;
            transform: translate(-50%, -50%);
            width: 600px; height: 400px;
            background: radial-gradient(circle, rgba(255, 140, 0, 0.04) 0%, transparent 70%);
            filter: blur(60px);
            z-index: 1;
            pointer-events: none;
        }

        /* 左上角来源：点击复制 */
        #source-box {
            position: absolute;
            top: 25px; left: 25px;
            width: 300px;
            font-size: 0.72rem;
            line-height: 1.6;
            color: rgba(212, 175, 55, 0.3);
            text-align: justify;
            z-index: 100;
            cursor: pointer;
            padding: 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
            transition: color 0.3s;
        }
        #source-box:hover { color: rgba(212, 175, 55, 0.8); }

        /* 右侧挂轴 */
        #poem-right {
            position: absolute;
            right: 40px; top: 50%;
            transform: translateY(-50%);
            writing-mode: vertical-rl;
            font-size: 1.05rem;
            line-height: 2.5;
            color: rgba(212, 175, 55, 0.35);
            letter-spacing: 0.5em;
            z-index: 10;
            border-right: 1px solid rgba(212, 175, 55, 0.1);
            padding-right: 15px;
        }

        /* 左侧信息 */
        #side-left-container {
            position: absolute;
            left: 50px; top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: row-reverse;
            z-index: 100;
        }
        #phase-left {
            writing-mode: vertical-rl;
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 0.5em;
            text-shadow: 0 0 10px currentColor;
        }
        #fragrance-hint {
            writing-mode: vertical-rl;
            font-size: 0.85rem;
            color: rgba(212, 175, 55, 0.4);
            letter-spacing: 0.3em;
            margin-right: 18px;
        }

        /* 3D 舞台：启用 GPU 隔离 */
        #stage {
            position: absolute;
            width: 100%; height: 100%;
            perspective: 1200px;
            perspective-origin: 50% 35%;
            z-index: 5;
            contain: layout style;
        }

        /* 底部口部及香气 */
        #mouth-arc {
            position: absolute;
            bottom: -15px; left: 50%;
            transform: translateX(-50%);
            width: 360px; height: 100px;
            background: radial-gradient(ellipse at center, rgba(212, 175, 55, 0.08) 0%, transparent 75%);
            border-top: 1.5px solid rgba(212, 175, 55, 0.15);
            border-radius: 50% 50% 0 0;
            z-index: 110;
        }
        .breath-gas {
            position: absolute;
            bottom: 60px; left: 50%;
            width: 100px; height: 100px;
            background: radial-gradient(circle, rgba(255, 255, 245, 0.1) 0%, transparent 70%);
            filter: blur(30px);
            border-radius: 50%;
            opacity: 0;
            z-index: 20;
            pointer-events: none;
            animation: breath-rise 5s ease-out forwards;
        }
        @keyframes breath-rise {
            0% { transform: translate3d(-50%, 0, 0) scale(0.6); opacity: 0; }
            20% { opacity: 0.4; }
            100% { transform: translate3d(-50%, -280px, 0) scale(3); opacity: 0; }
        }

        /* 底部佛号 */
        #mantra-bottom {
            position: absolute;
            bottom: 10vh; left: 50%;
            transform: translateX(-50%);
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 12px;
            opacity: 0;
            z-index: 120;
            transition: opacity 0.8s;
            pointer-events: none;
        }

        /* ================= 繁瓣艺术 3D 莲华 ================= */
        .lotus-3d-wrap {
            position: absolute;
            left: 50%; bottom: 60px;
            transform-style: preserve-3d;
            /* 核心：通知浏览器该元素将频繁变换，提前启用 GPU */
            will-change: transform, opacity;
            animation: flyToWest 10s ease-in-out forwards;
            pointer-events: none;
        }
        
        .lotus-halo {
            position: absolute;
            width: 200px; height: 200px;
            /* 优化：不再使用巨大的 blur，改用精准的渐变 */
            background: radial-gradient(circle, currentColor 0%, rgba(0,0,0,0) 70%);
            opacity: 0.3;
            transform: translate3d(-50%, -50%, -40px);
            left: 50%; top: 50%;
        }

        .lotus-body {
            position: relative;
            transform-style: preserve-3d;
        }

        /* 瓣膜：高性能艺术瓣膜 */
        .petal {
            position: absolute;
            bottom: 0; left: -35px;
            width: 70px; height: 120px;
            transform-origin: bottom center;
            opacity: 0.85;
            /* 性能优化：隐藏背面 */
            backface-visibility: hidden;
            /* 性能优化：渐变替代 mask */
            background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, currentColor 70%, rgba(255,255,255,0.8) 100%);
            /* 瓣膜形状：依然保持优美的版本4路径 */
            clip-path: path("M35 120 C50 100 70 80 70 45 C70 10 35 0 35 0 C35 0 0 10 0 45 C0 80 20 100 35 120 Z");
        }

        @keyframes flyToWest {
            0% { transform: translate3d(-50%, 0, 700px) rotateX(25deg); opacity: 0; }
            15% { opacity: 1; transform: translate3d(-50%, -5vh, 400px) rotateX(35deg); }
            100% { transform: translate3d(-50%, -40vh, -6500px) rotateX(85deg); opacity: 0; }
        }

        .fade-in-out { animation: fadeInOut 3.2s forwards; }
        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            15%, 85% { opacity: 0.95; }
        }

        #copy-toast {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(212, 175, 55, 0.95); color: #000;
            padding: 12px 30px; border-radius: 50px; font-weight: bold;
            opacity: 0; transition: 0.3s; z-index: 1000; pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="sky"></div>
    <div id="sunset-blur"></div>

    <div id="source-box" onclick="copySource()">
        兹录云水僧书壁念佛摄心偈，似发前人所未发。以之调摄身心，实较其他各法为有效。况念念存想莲华，即西方胜境而安心，自然有助净行，毫无流弊。与势至之都摄六根，净念相继，不谋而合。呈似印公老人，亦赞妙善。故敢钞附于此，俾如（森）驽钝之净业行人，依之修习。
    </div>

    <div id="side-left-container">
        <div id="phase-left">摄心念佛</div>
        <div id="fragrance-hint">口有莲华香气</div>
    </div>

    <div id="poem-right">
        若问念佛法 摄心自有方<br>
        每念一声佛 口作莲华香<br>
        因我清净心 所以有此香<br>
        华从口中出 朵朵向西方<br>
        一佛华一朵 有色复有光<br>
        念到一声佛 青色放青光<br>
        念到二声佛 黄色放黄光<br>
        念到三声佛 赤色放赤光<br>
        念到四声佛 白色放白光<br>
        如是轮转想 念念不可忘
    </div>

    <div id="stage"></div>
    <div id="mouth-arc"></div>
    <div id="mantra-bottom">南无阿弥陀佛</div>
    <div id="copy-toast">法义已复制</div>

    <script>
        const stage = document.getElementById('stage');
        const phaseLeft = document.getElementById('phase-left');
        const mantraBottom = document.getElementById('mantra-bottom');

        const phases = [
            { text: "青色放青光", color: "#1E90FF" },
            { text: "黄色放黄光", color: "#ffee00" },
            { text: "赤色放赤光", color: "#ff3300" },
            { text: "白色放白光", color: "#ffffff" }
        ];

        let count = 0;

        function chant() {
            const current = phases[count % 4];
            
            phaseLeft.innerText = current.text;
            phaseLeft.style.color = current.color;

            mantraBottom.style.color = current.color;
            mantraBottom.style.textShadow = `0 0 15px ${current.color}`;
            mantraBottom.classList.remove('fade-in-out');
            void mantraBottom.offsetWidth; 
            mantraBottom.classList.add('fade-in-out');

            // 产生香气
            const gas = document.createElement('div');
            gas.className = 'breath-gas';
            document.body.appendChild(gas);
            setTimeout(() => gas.remove(), 5000);

            // 产生繁瓣莲华
            createLushLotus(current.color);
            count++;
        }

        function createLushLotus(color) {
            const wrap = document.createElement('div');
            wrap.className = 'lotus-3d-wrap';
            wrap.style.color = color;

            const halo = document.createElement('div');
            halo.className = 'lotus-halo';
            wrap.appendChild(halo);

            const body = document.createElement('div');
            body.className = 'lotus-body';

            // 完美的 8+8+6 层叠结构
            const config = [
                { petals: 8, angle: 70, z: -12, scale: 1.1 },
                { petals: 8, angle: 45, z: 0,   scale: 0.9 },
                { petals: 6, angle: 20, z: 12,  scale: 0.6 }
            ];

            config.forEach(layer => {
                for (let i = 0; i < layer.petals; i++) {
                    const p = document.createElement('div');
                    p.className = 'petal';
                    const rotY = (360 / layer.petals) * i;
                    // 使用 translate3d 提升渲染效率
                    p.style.transform = `rotateY(${rotY}deg) rotateX(${layer.angle}deg) translate3d(0, 0, ${layer.z}px) scale(${layer.scale})`;
                    body.appendChild(p);
                }
            });

            wrap.appendChild(body);
            stage.appendChild(wrap);
            
            // 定时清理，防止 DOM 过多
            setTimeout(() => wrap.remove(), 10200);
        }

        function copySource() {
            const text = document.getElementById('source-box').innerText + "\n\n" + document.getElementById('poem-right').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('copy-toast');
                toast.style.opacity = '1';
                setTimeout(() => toast.style.opacity = '0', 2000);
            });
        }

        // 节奏设置
        setInterval(chant, 3500);
        setTimeout(chant, 1000);
    </script>
</body>
</html>
