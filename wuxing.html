<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>中医五行 · 手机版</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #f0f4f8;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            padding: 12px 10px 20px;
            display: flex;
            justify-content: center;
        }
        .wrap {
            max-width: 420px;
            width: 100%;
        }

        /* ===== 标题 ===== */
        .header {
            text-align: center;
            padding: 6px 0 10px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1a2a3a;
            margin: 0;
            letter-spacing: 2px;
        }
        .header h1 span { color: #c0392b; }
        .header p {
            font-size: 13px;
            color: #7f8c8d;
            margin: 4px 0 0;
        }

        /* ===== 五行卡片纵向列表 ===== */
        .node-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }
        .el-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-left: 5px solid #ccc;
            transition: box-shadow 0.2s;
            touch-action: manipulation;
        }
        .el-card:active {
            box-shadow: 0 2px 12px rgba(0,0,0,0.10);
        }

        /* 左侧：名称 + 器官 */
        .el-info {
            flex: 0 0 58px;
        }
        .el-name {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.2;
        }
        .el-organ {
            font-size: 11px;
            color: #7f8c8d;
            line-height: 1.2;
        }

        /* 中间：能量柱 */
        .bar-wrap {
            flex: 1;
            height: 44px;
            background: #ecf0f1;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            min-width: 60px;
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.35s ease;
            border-radius: 8px;
            opacity: 0.85;
        }
        .bar-label {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            font-weight: 600;
            color: #2c3e50;
            background: rgba(255,255,255,0.7);
            padding: 0 6px;
            border-radius: 4px;
        }

        /* 右侧：+ / - 按钮 */
        .btns {
            display: flex;
            gap: 8px;
            flex: 0 0 72px;
        }
        .btns button {
            flex: 1;
            height: 48px;
            border: none;
            border-radius: 12px;
            font-size: 24px;
            font-weight: 500;
            color: #fff;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.15s;
            touch-action: manipulation;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .btns button:active {
            transform: scale(0.92);
            opacity: 0.8;
        }

        /* ===== 图例 ===== */
        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 14px;
            margin: 14px 0 8px;
            font-size: 11px;
            color: #5d6d7e;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .legend-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .legend-line {
            display: inline-block;
            width: 20px;
            height: 2px;
        }

        /* ===== 日志 ===== */
        .log {
            background: #ffffff;
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 13px;
            line-height: 1.8;
            color: #34495e;
            min-height: 64px;
            margin: 10px 0 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            border-left: 4px solid #bdc3c7;
        }
        .log strong { color: #1a2a3a; }

        .ev-sheng { color: #27ae60; }
        .ev-ke    { color: #7f8c8d; }
        .ev-xu    { color: #6b7280; }
        .ev-dao   { color: #d97706; }
        .ev-cheng { color: #e74c3c; }
        .ev-wu    { color: #8e44ad; }

        /* ===== 底部按钮 ===== */
        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 4px;
        }
        .actions button {
            flex: 1;
            max-width: 160px;
            padding: 14px 0;
            font-size: 15px;
            font-weight: 500;
            background: transparent;
            color: #2c3e50;
            border: 1.5px solid #d5dbdb;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            touch-action: manipulation;
            user-select: none;
            background: #ffffff;
        }
        .actions button:active {
            background: #ecf0f1;
            transform: scale(0.97);
        }
        .actions button.primary {
            border-color: #5d6d7e;
            background: #2c3e50;
            color: #fff;
        }
        .actions button.primary:active {
            background: #1a2a3a;
        }

        /* ===== 状态标签颜色 ===== */
        .state-tag {
            font-size: 10px;
            padding: 1px 8px;
            border-radius: 20px;
            margin-left: 4px;
            font-weight: 500;
        }
        .state-tag.重虚 { background: #fde8e8; color: #c0392b; }
        .state-tag.偏虚 { background: #fdebd0; color: #d97706; }
        .state-tag.平   { background: #d5f5e3; color: #27ae60; }
        .state-tag.偏盛 { background: #fdebd0; color: #d97706; }
        .state-tag.亢盛 { background: #fde8e8; color: #c0392b; }
    </style>
</head>
<body>

<div class="wrap">
    <div class="header">
        <h1>☯ 五行<span>·</span>沙盘</h1>
        <p>点击 + / − 观察五脏联动</p>
    </div>

    <!-- 五行卡片列表 -->
    <div id="nodeList" class="node-list"></div>

    <!-- 图例 -->
    <div class="legend">
        <span class="legend-item"><span class="legend-dot" style="background:#27ae60;"></span> 相生</span>
        <span class="legend-item"><span class="legend-dot" style="background:#7f8c8d;"></span> 相克</span>
        <span class="legend-item"><span class="legend-dot" style="background:#6b7280;"></span> 母病及子</span>
        <span class="legend-item"><span class="legend-dot" style="background:#d97706;"></span> 子盗母气</span>
        <span class="legend-item"><span class="legend-dot" style="background:#e74c3c;"></span> 相乘</span>
        <span class="legend-item"><span class="legend-dot" style="background:#8e44ad;"></span> 相侮</span>
    </div>

    <!-- 日志 -->
    <div class="log" id="log">
        <strong>当前状态：</strong><br>
        <span id="logText">五脏平衡 · 能量皆为 5</span>
    </div>

    <!-- 底部按钮 -->
    <div class="actions">
        <button class="primary" onclick="doRebalance()">↻ 自愈</button>
        <button onclick="resetAll()">归位 5</button>
    </div>
</div>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 五行配置
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const ELS = [
    { id:0, name:'木', organ:'肝', color:'#27ae60', sheng:1, ke:2, mother:4, ctrl:3 },
    { id:1, name:'火', organ:'心', color:'#e74c3c', sheng:2, ke:3, mother:0, ctrl:4 },
    { id:2, name:'土', organ:'脾', color:'#d97706', sheng:3, ke:4, mother:1, ctrl:0 },
    { id:3, name:'金', organ:'肺', color:'#7f8c8d', sheng:4, ke:0, mother:2, ctrl:1 },
    { id:4, name:'水', organ:'肾', color:'#2980b9', sheng:0, ke:1, mother:3, ctrl:2 }
];

let vals = [5, 5, 5, 5, 5];

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 渲染（纵向卡片）
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function render() {
    const container = document.getElementById('nodeList');
    container.innerHTML = '';

    ELS.forEach((el, i) => {
        const v = vals[i];
        const pct = Math.max(5, Math.min(100, (v / 10) * 100));
        const stateLabel = v <= 2 ? '重虚' : v <= 4 ? '偏虚' : v <= 6 ? '平' : v <= 8 ? '偏盛' : '亢盛';

        const card = document.createElement('div');
        card.className = 'el-card';
        card.style.borderLeftColor = el.color;

        card.innerHTML = `
            <div class="el-info">
                <div class="el-name" style="color:${el.color}">${el.name}</div>
                <div class="el-organ">${el.organ}</div>
            </div>
            <div class="bar-wrap">
                <div class="bar-fill" style="width:${pct}%;background:${el.color};"></div>
                <span class="bar-label">${v.toFixed(1)}</span>
            </div>
            <div class="btns">
                <button style="background:${el.color};" onclick="change(${i}, 1.0)">＋</button>
                <button style="background:${el.color};opacity:0.7;" onclick="change(${i}, -1.0)">－</button>
            </div>
        `;
        container.appendChild(card);
    });
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 核心逻辑（与之前一致，基于快照同时计算）
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function clamp(v) { return Math.max(1, Math.min(10, v)); }

function applyTCM() {
    const old = [...vals];
    const delta = [0, 0, 0, 0, 0];
    const events = [];

    for (let i = 0; i < 5; i++) {
        const el = ELS[i];
        const v = old[i];
        const { sheng, ke, mother, ctrl } = el;

        // 相生（我生者受益）
        if (v > 5) {
            const strength = (v - 5) / 5;
            const gain = strength * 0.25;
            delta[sheng] += gain;
            if (strength > 0.15) events.push(`sheng:${el.name}生${ELS[sheng].name}`);
        }

        // 相克（我克者受损）
        if (v > 5) {
            const strength = (v - 5) / 5;
            const loss = strength * 0.18;
            delta[ke] -= loss;
            if (strength > 0.15) events.push(`ke:${el.name}克${ELS[ke].name}`);
        }

        // 母病及子（母虚 → 子受损）
        if (v < 5) {
            const weakness = (5 - v) / 5;
            const loss = weakness * 0.15;
            delta[sheng] -= loss;
            if (weakness > 0.15) events.push(`xu:${el.name}虚→${ELS[sheng].name}受损`);
        }

        // 子盗母气（子亢盛 → 母受损）
        if (v > 7) {
            const excess = (v - 7) / 3;
            const loss = excess * 0.12;
            delta[mother] -= loss;
            if (excess > 0.1) events.push(`dao:${el.name}亢→${ELS[mother].name}被盗`);
        }

        // 相乘（过度克制）
        if (v > 6 && old[ke] < 5) {
            const severity = (v - 6) / 4 * (5 - old[ke]) / 5;
            const loss = severity * 0.30;
            delta[ke] -= loss;
            if (severity > 0.08) events.push(`cheng:${el.name}乘${ELS[ke].name}`);
        }

        // 相侮（反克）
        if (v > 8 && old[ctrl] < 5) {
            const severity = (v - 8) / 2 * (5 - old[ctrl]) / 5;
            const loss = severity * 0.25;
            delta[ctrl] -= loss;
            if (severity > 0.08) events.push(`wu:${el.name}侮${ELS[ctrl].name}`);
        }
    }

    for (let i = 0; i < 5; i++) {
        vals[i] = clamp(vals[i] + delta[i]);
    }

    return events;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 交互
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function change(i, delta) {
    vals[i] = clamp(vals[i] + delta);
    const events = applyTCM();
    render();
    updateLog(events);
}

function doRebalance() {
    for (let i = 0; i < 5; i++) {
        vals[i] += (5 - vals[i]) * 0.12;
        vals[i] = clamp(vals[i]);
    }
    const events = applyTCM();
    render();
    updateLog(events, true);
}

function resetAll() {
    vals = [5, 5, 5, 5, 5];
    render();
    document.getElementById('logText').textContent = '五脏平衡 · 能量皆为 5';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 日志
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const evClass = {
    sheng: 'ev-sheng', ke: 'ev-ke', xu: 'ev-xu',
    dao: 'ev-dao', cheng: 'ev-cheng', wu: 'ev-wu'
};

function updateLog(events, isRebalance) {
    const stateLabel = v =>
        v <= 2 ? '重虚' : v <= 4 ? '偏虚' : v <= 6 ? '平' : v <= 8 ? '偏盛' : '亢盛';

    let parts = [];
    ELS.forEach((el, i) => {
        parts.push(`<span style="color:${el.color}">${el.name}${vals[i].toFixed(1)}</span>`);
    });

    let html = parts.join('　');

    const fmtEvts = evs => evs.map(e => {
        const [t, ...rest] = e.split(':');
        return `<span class="${evClass[t] || ''}">${rest.join(':')}</span>`;
    }).join('　');

    if (isRebalance) {
        html += '<br>↻ 自愈向平衡收敛';
        if (events.length) html += '　' + fmtEvts(events);
    } else if (events.length) {
        html += '<br>▶ ' + fmtEvts(events);
    } else {
        html += '<br><span style="color:#95a5a6;">无明显传导</span>';
    }

    document.getElementById('logText').innerHTML = html;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// 初始化
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
render();
document.getElementById('logText').textContent = '五脏平衡 · 能量皆为 5';
</script>
</body>
</html>
