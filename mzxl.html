<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <title>Fused Page</title>
    <style>
        /* 基础重置 */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        
        /* Iframe 隔离层 */
        iframe { width: 100vw; height: 100vh; border: none; position: absolute; top: 0; left: 0; background: #fff; }
        
        /* 组件样式 (按钮/公告框) */
        #fusion-widget {
            position: fixed;
            top: 50%; 
            left: 50%;
            /* 坐标定位 */
            transform: translate(-50%, -50%) translate(840px, 407px);
            
            width: 140px; 
            height: 48px;
            
            /* 外观 */
            background: linear-gradient(135deg, #0066cc, #314549);
            color: #ffffff;
            border: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
            text-shadow: none;
            border-radius: 999px;
            
            /* 字体设置 */
            font-family: 'Microsoft YaHei', sans-serif;
            font-size: 14px;
            font-weight: bold;
            
            /* 布局 */
            display: flex; align-items: center; justify-content: center;
            text-align: center;
            white-space: pre-wrap; /* 支持换行 */
            line-height: 1.4;
            overflow: hidden;
            
            z-index: 999999;
            user-select: none; touch-action: none;
        }
        
        #fusion-widget:active { 
            opacity: 0.9; 
            /* 仅在非固定模式下添加按压缩放效果 */
            transform: translate(-50%, -50%) translate(840px, 407px) scale(0.98);
        }
    </style>

        // --- 交互逻辑 (拖拽模式) ---
        btn.style.cursor = 'move';
        let isDrag = false;
        let startX, startY;
        let currentX = 840, currentY = 407;

        btn.addEventListener('pointerdown', (e) => {
            isDrag = false;
            startX = e.clientX;
            startY = e.clientY;
            btn.setPointerCapture(e.pointerId);
            btn.addEventListener('pointermove', onMove);
            btn.addEventListener('pointerup', onUp);
        });

        function onMove(e) {
            if (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5) {
                isDrag = true;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                const nx = currentX + dx;
                const ny = currentY + dy;
                btn.style.transform = `translate(-50%, -50%) translate(${nx}px, ${ny}px)`;
            }
        }

        function onUp(e) {
            btn.removeEventListener('pointermove', onMove);
            btn.removeEventListener('pointerup', onUp);
            if (isDrag) {
                currentX += (e.clientX - startX);
                currentY += (e.clientY - startY);
            } else {
                // 如果不是拖拽，且不是纯展示模式，则执行点击动作
