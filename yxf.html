    <style>
        /* 基础重置 */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        
        /* Iframe 隔离层 */
        iframe { width: 100vw; height: 100vh; border: none; position: absolute; top: 0; left: 0; background: #fff; }
        
        /* 组件样式 (按钮/公告框) */
        #fusion-widget {
            position: fixed;
            top: 50%; 
            left: 50%;
            /* 坐标定位 */
            transform: translate(-50%, -50%) translate(-812px, 164px);
            
            width: 140px; 
            height: 48px;
            
            /* 外观 */
            background: rgba(30, 30, 30, 0.75);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            text-shadow: none;
            border-radius: 999px;
            
            /* 字体设置 */
            font-family: 'Microsoft YaHei', sans-serif;
            font-size: 14px;
            font-weight: bold;
            
            /* 布局 */
            display: flex; align-items: center; justify-content: center;
            text-align: center;
            white-space: pre-wrap; /* 支持换行 */
            line-height: 1.4;
            overflow: hidden;
            
            z-index: 999999;
            user-select: none; touch-action: none;
        }
        
        #fusion-widget:active { 
            opacity: 0.9; 
            /* 仅在非固定模式下添加按压缩放效果 */
            transform: translate(-50%, -50%) translate(-812px, 164px) scale(0.98);

ter; \n            margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px;\n        }\n        .header h2 { font-size: 24px; letter-spacing: 1px; font-weight: 600; }\n        .mode-badge { \n            font-size: 14px; padding: 6px 12px; border-radius: 6px; font-weight: bold; text-transform: uppercase; \n        }\n\n        /* 主题切换 */\n        body.theme-gold .mode-badge { background: var(--gold-dim); color: var(--gold); }\n        body.theme-fibo .mode-badge { background: var(--fibo-dim); color: var(--fibo); }\n\n        /* 控制面板 */\n        .controls { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 15px; margin-bottom: 25px; }\n        .input-group { background: var(--panel-bg); padding: 12px 15px; border-radius: 10px; border: 1px solid var(--border); }\n        .input-group label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 8px; }\n        .input-group input { \n            background: transparent; border: none; color: #fff; width: 100%; font-size: 18px; font-weight: bold; outline: none; \n        }\n\n        .btn { \n            border: 1px solid var(--border); background: var(--panel-bg); color: #fff; \n            border-radius: 10px; cursor: pointer; transition: 0.2s; display: grid; place-items: center;\n            font-size: 16px;\n        }\n        .btn:hover { background: rgba(255,255,255,0.15); border-color: #666; }\n        .btn:active { transform: scale(0.98); }\n        .btn-mode { height: 100%; padding: 0 20px; font-size: 16px; }\n        .btn-mode.active { border-color: currentColor; background: rgba(255,255,255,0.08); box-shadow: 0 0 10px rgba(0,0,0,0.2); }\n\n        /* 可视化核心区 */\n        .viz-box { \n            background: #080808; border: 1px solid var(--border); border-radius: 14px; \n            padding: 70px 30px 50px; position: relative; margin-bottom: 25px;\n        }\n        \n        .track { width: 100%; height: 8px; background: #333; position: relative; border         // --- 交互逻辑 (拖拽模式) ---
        btn.style.cursor = 'move';
        let isDrag = false;
        let startX, startY;
        let currentX = -812, currentY = 164;

        btn.addEventListener('pointerdown', (e) => {
            isDrag = false;
            startX = e.clientX;
            startY = e.clientY;
            btn.setPointerCapture(e.pointerId);
            btn.addEventListener('pointermove', onMove);
            btn.addEventListener('pointerup', onUp);
        });

        function onMove(e) {
            if (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5) {
                isDrag = true;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                const nx = currentX + dx;
                const ny = currentY + dy;
                btn.style.transform = `translate(-50%, -50%) translate(${nx}px, ${ny}px)`;
            }
        }

        function onUp(e) {
            btn.removeEventListener('pointermove', onMove);
            btn.removeEventListener('pointerup', onUp);
            if (isDrag) {
                currentX += (e.clientX - startX);
                currentY += (e.clientY - startY);
