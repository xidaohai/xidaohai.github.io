ter; \n            margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px;\n        }\n        .header h2 { font-size: 24px; letter-spacing: 1px; font-weight: 600; }\n        .mode-badge { \n            font-size: 14px; padding: 6px 12px; border-radius: 6px; font-weight: bold; text-transform: uppercase; \n        }\n\n        /* 主题切换 */\n        body.theme-gold .mode-badge { background: var(--gold-dim); color: var(--gold); }\n        body.theme-fibo .mode-badge { background: var(--fibo-dim); color: var(--fibo); }\n\n        /* 控制面板 */\n        .controls { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 15px; margin-bottom: 25px; }\n        .input-group { background: var(--panel-bg); padding: 12px 15px; border-radius: 10px; border: 1px solid var(--border); }\n        .input-group label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 8px; }\n        .input-group input { \n            background: transparent; border: none; color: #fff; width: 100%; font-size: 18px; font-weight: bold; outline: none; \n        }\n\n        .btn { \n            border: 1px solid var(--border); background: var(--panel-bg); color: #fff; \n            border-radius: 10px; cursor: pointer; transition: 0.2s; display: grid; place-items: center;\n            font-size: 16px;\n        }\n        .btn:hover { background: rgba(255,255,255,0.15); border-color: #666; }\n        .btn:active { transform: scale(0.98); }\n        .btn-mode { height: 100%; padding: 0 20px; font-size: 16px; }\n        .btn-mode.active { border-color: currentColor; background: rgba(255,255,255,0.08); box-shadow: 0 0 10px rgba(0,0,0,0.2); }\n\n        /* 可视化核心区 */\n        .viz-box { \n            background: #080808; border: 1px solid var(--border); border-radius: 14px; \n            padding: 70px 30px 50px; position: relative; margin-bottom: 25px;\n        }\n        \n        .track { width: 100%; height: 8px; background: #333; position: relative; border
