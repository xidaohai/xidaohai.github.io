<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>0.618 优选法</title>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --panel-bg: rgba(22, 22, 26, 0.95);
            --border-color: #2a2a2e;
            --text-main: #f0f0f0;
            --text-sub: #88888b;
            --yellow: #ffd700;
            --yellow-dark: #b89b1c;
            --blue: #4dabf7;
            --red: #ff6b6b;
            --green: #00ff88;
            --cyan: #00e5ff;
            --purple: #bf5af2;
            --radius: 14px;
            --spring-easing: cubic-bezier(0.34, 1.56, 0.64, 1);
            --smooth-easing: cubic-bezier(0.4, 0, 0.2, 1);
            --mono-font: 'JetBrains Mono', 'Consolas', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "SF Pro Text", "PingFang SC", sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg-color);
            background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.03) 1px, transparent 0), radial-gradient(circle at 50% 50%, #1a1a22 0%, #0b0b0e 100%);
            background-size: 24px 24px, 100% 100%;
            color: var(--text-main); display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px; overflow-x: hidden;
        }

        .container {
            display: flex; gap: 25px; width: 100%; max-width: 1150px;
            transition: all 0.6s var(--smooth-easing); position: relative;
        }

        .container.no-anim .marker,
        .container.no-anim .track-active,
        .container.no-anim .track-focus-zone,
        .container.no-anim .marker-label,
        .container.no-anim .marker.target {
            transition: none !important;
        }

        /* 模式切换器 */
        .mode-tabs {
            display: flex; background: #141418; border: 1px solid var(--border-color); border-radius: 10px; padding: 3px; gap: 4px;
        }
        .mode-tab {
            flex: 1; background: transparent; border: none; color: var(--text-sub); font-size: 13px; font-weight: bold; padding: 8px 0; border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        .mode-tab.active { background: #282830; color: var(--yellow); box-shadow: 0 2px 8px rgba(0,0,0,0.4); }

        /* 高级模式元素显隐控制 */
        .adv-only { display: none !important; }
        .container.is-advanced .adv-only { display: flex !important; }
        .container.is-advanced .adv-only-inline { display: inline-block !important; }

        @media (max-width: 900px) {
            .container { flex-direction: column; align-items: center; padding-bottom: 80px; }
            body { align-items: flex-start; overflow-y: auto; }
            .left-panel, .right-panel { width: 100% !important; min-width: unset !important; }
            .right-panel { max-height: 400px !important; }
            .input-section { flex-wrap: wrap !important; gap: 15px !important; padding: 20px !important; }
            .input-group { flex: 1 1 calc(50% - 10px) !important; }
            .input-group.target-group { flex: 1 1 100% !important; }
            .input-group input { font-size: 18px !important; padding: 12px 5px !important; height: 50px !important; }
            .btn-controls { display: flex !important; gap: 10px; width: 100%; justify-content: center; margin-top: 5px; }
            .btn-controls .btn-icon { width: 50% !important; height: 45px !important; }
        }

        .manual-mode-active { max-width: 800px; }
        .manual-mode-active .panel:not(.left-panel),
        .manual-mode-active .header,
        .manual-mode-active .mode-tabs,
        .manual-mode-active .input-section,
        .manual-mode-active .actions-section,
        .manual-mode-active .aux-btns { display: none !important; }
        .manual-mode-active .left-panel { border-color: var(--purple); box-shadow: 0 0 40px rgba(191, 90, 242, 0.15); }

        .panel { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); backdrop-filter: blur(12px); transition: all 0.4s ease; }
        .left-panel { flex: 1.8; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
        .right-panel { flex: 1; min-width: 320px; display: flex; flex-direction: column; overflow: hidden; max-height: 85vh; }
        
        .header h1 { font-size: clamp(20px, 4vw, 24px); letter-spacing: -0.5px; }
        .header h1 span { color: var(--yellow); }
        .header .desc { font-size: 12px; color: var(--text-sub); line-height: 1.6; margin-top: 6px; }

        .input-section { display: flex; gap: 12px; align-items: flex-end; background: rgba(255,255,255,0.03); padding: 16px; border-radius: var(--radius); border: 1px solid var(--border-color); }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
        .input-group label { color: var(--text-sub); font-size: 11px; font-weight: bold; }
        .input-group input { background: #000; border: 1px solid #333; border-radius: 8px; color: var(--yellow); font-size: 16px; font-weight: bold; padding: 10px; outline: none; transition: 0.3s; width: 100%; text-align: center; font-family: var(--mono-font); }
        .input-group input:focus { border-color: var(--yellow); }

        .btn-icon { background: #252525; border: 1px solid #444; color: #fff; width: 44px; height: 44px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; flex-shrink: 0; }
        .btn-icon:hover { border-color: var(--yellow); }
        #btn-anchor-toggle.active { border-color: #fff; background: #444; box-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .btn-controls { display: flex; gap: 8px; flex-shrink: 0; }

        .visualizer-section { border: 1px solid var(--border-color); border-radius: var(--radius); padding: 60px 25px 40px 25px; position: relative; background: rgba(255,255,255,0.01); user-select: none; overflow: hidden; }
        .track-viewport { position: relative; width: 100%; overflow: visible; padding: 20px 0; }

        .marker-label { position: absolute; font-size: 11px; font-weight: 900; top: -15px; transform: translateX(-50%); transition: left 0.7s var(--spring-easing), transform 0.5s var(--smooth-easing); white-space: nowrap; }
        .marker-label.a { color: var(--blue); }
        .marker-label.b { color: var(--red); }
        .marker-label.shift-left { transform: translateX(calc(-100% - 8px)); }
        .marker-label.shift-right { transform: translateX(8px); }

        .track-container { position: relative; height: 36px; display: flex; align-items: center; cursor: pointer; }
        .track-bg { position: absolute; width: 100%; height: 6px; background: #1a1a1a; border-radius: 10px; }
        .track-active { position: absolute; height: 6px; background: #3d3b26; border-radius: 10px; transition: left 0.7s var(--spring-easing), width 0.7s var(--spring-easing); border: 1px solid rgba(255, 215, 0, 0.15); }
        .track-focus-zone { position: absolute; height: 10px; background: rgba(0, 229, 255, 0.15); border-radius: 10px; transition: 0.5s; opacity: 0; border: 1px dashed var(--cyan); pointer-events: none; }
        .track-focus-zone.visible { opacity: 1; }

        .marker { position: absolute; top: 50%; width: 3px; height: 32px; border-radius: 2px; transform: translate(-50%, -50%); transition: left 0.7s var(--spring-easing); z-index: 10; pointer-events: none; }
        .marker.a { background: var(--blue); box-shadow: 0 0 10px var(--blue); }
        .marker.b { background: var(--red); box-shadow: 0 0 10px var(--red); }
        .marker.target { width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 15px rgba(255, 255, 255, 0.8); z-index: 15; opacity: 0; transition: left 0.7s var(--spring-easing), opacity 0.3s; }
        .marker.target.visible { opacity: 1; }
        .marker.manual-preview { width: 16px; height: 16px; background: var(--purple); border-radius: 50%; box-shadow: 0 0 15px var(--purple); z-index: 20; display: none; transition: left 0.1s linear; }
        .floating-val { position: absolute; background: var(--purple); color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: bold; top: -42px; transform: translateX(-50%); pointer-events: none; display: none; box-shadow: 0 5px 15px rgba(191, 90, 242, 0.4); z-index: 30; font-family: var(--mono-font); }

        .bounds-labels { display: flex; justify-content: space-between; margin-top: 25px; font-family: var(--mono-font); }
        #txt-min, #txt-max { background: #000; border: 1px solid #333; border-radius: 8px; color: var(--yellow); font-size: 16px; font-weight: bold; padding: 6px 12px; font-family: var(--mono-font); text-align: center; min-width: 60px; }
        .step-tag { position: absolute; left: 50%; transform: translateX(-50%); background: var(--yellow-dark); color: #000; padding: 2px 10px; border-radius: 20px; font-size: 10px; font-weight: 900; }

        .actions-section { display: flex; gap: 15px; }
        .action-card { flex: 1; background: #1e1e24; border: 1px solid var(--border-color); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.3s; }
        .action-card:hover { border-color: #555; }
        .action-card.a { border-bottom: 4px solid var(--blue); }
        .action-card.b { border-bottom: 4px solid var(--red); }
        .action-value { font-size: clamp(22px, 5vw, 28px); font-weight: bold; font-family: var(--mono-font); letter-spacing: -0.5px; }

        .aux-btns { display: flex; flex-direction: column; gap: 10px; }
        .btn-aux { padding: 14px; border-radius: var(--radius); cursor: pointer; transition: 0.3s; font-size: 13px; font-weight: bold; display: flex; align-items: center; justify-content: center; border: 1px solid #444; width: 100%; }
        .btn-undo { background: transparent; color: var(--text-sub); }
        .btn-undo:not(:disabled):hover { color: #fff; border-color: #888; }
        .btn-mid { background: #2d2d35; color: #e0e0e0; }
        .btn-target-mid { background: #1e2a2d; color: #b0e0e6; }
        .btn-manual { background: #2a1e2d; color: #e0b0e6; border-color: #443344; }

        .manual-controls { display: none; flex-direction: column; gap: 20px; margin-top: 15px; animation: fadeIn 0.5s ease; }
        .container.manual-mode-active .manual-controls { display: flex; }
        .div-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .btn-div { background: #222; border: 1px solid #444; color: #aaa; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.3s; }
        .btn-div.active { border-color: var(--cyan); color: var(--cyan); background: rgba(0, 229, 255, 0.1); }
        .confirm-bar { display: flex; gap: 12px; }
        .btn-confirm { flex: 2; background: var(--green); color: #000; border: none; padding: 15px; border-radius: var(--radius); cursor: pointer; font-weight: 900; font-size: 15px; }
        .btn-cancel { flex: 1; background: #333; color: #fff; border: none; padding: 15px; border-radius: var(--radius); cursor: pointer; font-weight: bold; }
        .division-mark { position: absolute; width: 2px; height: 16px; background: var(--cyan); top: 50%; transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 0 6px var(--cyan); }

        /* 撕纸动画 */
        .crease-line { position: absolute; top: -10px; bottom: -10px; width: 3px; background: transparent; border-left: 3px dashed #ffd700; box-shadow: 0 0 12px #ffd700; z-index: 30; pointer-events: none; opacity: 1; animation: creaseFlash 1s ease 2; }
        @keyframes creaseFlash { 0%,100% { opacity:1; } 50% { opacity:0.1; } }
        .discard-part { position: absolute; top: 50%; transform: translateY(-50%); height: 24px; background: repeating-linear-gradient(45deg, rgba(255,80,80,0.25), rgba(255,80,80,0.25) 10px, rgba(0,0,0,0) 10px, rgba(0,0,0,0) 20px); border: 2px dashed #ff4d4d; border-radius: 4px; z-index: 25; pointer-events: none; transition: width 0.9s cubic-bezier(0.4,0,0.2,1), opacity 0.9s; clip-path: polygon(0% 0%, 100% 0%, 97% 100%, 0% 100%); box-shadow: inset 0 0 15px rgba(255,0,0,0.15); display: flex; align-items: center; justify-content: center; color: #ffb3b3; font-size: 13px; font-weight: bold; text-shadow: 0 0 6px #000; }

        /* 动画开关按钮 */
        .toggle-btn { background: #252525; border: 1px solid #444; color: #fff; width: 100%; padding: 12px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; font-size: 13px; font-weight: bold; gap: 8px; }
        .toggle-btn:hover { border-color: var(--yellow); }
        .toggle-btn .indicator { width: 10px; height: 10px; border-radius: 50%; background: var(--green); display: inline-block; transition: 0.3s; }
        .toggle-btn.off .indicator { background: #555; }
        .toggle-btn.off { border-color: #666; }

        .history-list { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 12px; margin-top: 15px; padding-right: 8px; }
        .history-list::-webkit-scrollbar { width: 5px; }
        .history-list::-webkit-scrollbar-thumb { background: #33333a; border-radius: 10px; }
        .history-item { padding: 16px; background: rgba(255,255,255,0.02); border-radius: 12px; font-size: 13px; line-height: 1.6; border-left: 4px solid var(--yellow); animation: slideUp 0.4s var(--smooth-easing) forwards; border-right: 1px solid rgba(255,255,255,0.02); }
        .history-item.is-manual { border-left-color: var(--purple); background: rgba(191, 90, 242, 0.05); }
        .history-item.is-midpoint { border-left-color: var(--green); }
        .history-item.is-hybrid { border-left-color: var(--cyan); }
        .history-item b { font-family: var(--mono-font); color: var(--yellow); font-size: 14px; }
        .keep-badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-weight: bold; font-family: var(--mono-font); margin: 0 2px; font-size: 12px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .footer { text-decoration: none; display: block; padding: 15px; font-size: 12px; color: var(--text-sub); text-align: center; }
        @media (min-width: 901px) { .footer { position: absolute; bottom: -45px; right: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); border: 1px solid #333; border-radius: 30px; padding: 8px 20px; z-index: 100; } }
    </style>
</head>
<body>
<div class="container" id="main-container">
    <div class="panel left-panel">
        <!-- 模式切换器 -->
        <div class="mode-tabs">
            <button class="mode-tab active" id="tab-normal">一般模式 (纯优选)</button>
            <button class="mode-tab" id="tab-advanced">高级模式 (参考点 & 精选)</button>
        </div>

        <div class="header">
            <h1>Jack Kiefer / 华罗庚 <span>0.618 优选法</span></h1>
            <div class="desc">
                严格单峰情况下，优选法同时满足最快与最易操作。<br>
                只要碰到一样的效果，则把两端外去掉，继续优选。（山峰在内，但不一定在正中间）
            </div>
        </div>

        <div class="input-section">
            <div class="input-group">
                <label>下限 Min</label>
                <input type="number" id="in-min" value="0" step="any">
            </div>
            <div class="input-group">
                <label>上限 Max</label>
                <input type="number" id="in-max" value="100" step="any">
            </div>
            <div class="input-group target-group adv-only">
                <label>心中参考 T</label>
                <input type="number" id="in-target" placeholder="可手动输入" step="any">
            </div>
            <div class="btn-controls">
                <button class="btn-icon adv-only" id="btn-anchor-toggle" title="锚点开关">
                    <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-12.5c-2.48 0-4.5 2.02-4.5 4.5S9.52 16.5 12 16.5s4.5-2.02 4.5-4.5S14.48 7.5 12 7.5z"/></svg>
                </button>
                <button class="btn-icon" id="btn-reset" title="全局重置">
                    <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                </button>
            </div>
        </div>

        <div class="visualizer-section">
            <div class="track-viewport">
                <div class="marker-label a" id="lab-a">方案 A</div>
                <div class="marker-label b" id="lab-b">方案 B</div>
                <div class="track-container" id="track-box">
                    <div class="track-bg"></div>
                    <div class="track-active" id="bar-active"></div>
                    <div class="track-focus-zone" id="focus-zone"></div>
                    <div id="div-marks-container"></div>
                    <div class="marker a" id="ptr-a"></div>
                    <div class="marker b" id="ptr-b"></div>
                    <div class="marker target adv-only-inline" id="ptr-t"></div>
                    <div class="marker manual-preview" id="manual-ptr"></div>
                    <div class="floating-val" id="float-val">0.000</div>
                </div>
            </div>
            <div class="bounds-labels">
                <span id="txt-min">0.000</span>
                <div class="step-tag" id="txt-step">STEP 1</div>
                <span id="txt-max">100.000</span>
            </div>
        </div>

        <div class="actions-section">
            <div class="action-card a" id="btn-a"><div class="action-value" id="val-a">38.200</div></div>
            <div class="action-card b" id="btn-b"><div class="action-value" id="val-b">61.800</div></div>
        </div>

        <div class="aux-btns">
            <button class="btn-aux btn-undo" id="btn-undo" disabled>撤销回溯</button>
            <button class="btn-aux btn-mid" id="btn-mid">无法再选，取中点结果</button>
            <button class="btn-aux btn-target-mid adv-only" id="btn-target-mid">取参考 T 与 AB中点之间</button>
            <button class="btn-aux btn-manual adv-only" id="btn-manual-mode">精选模式：手动精准选取</button>
            <!-- 动画开关 -->
            <button class="toggle-btn" id="btn-toggle-anim">
                <span class="indicator" id="anim-indicator"></span>
                <span id="anim-label">动画开</span>
            </button>
        </div>

        <div class="manual-controls" id="manual-controls">
            <p style="text-align:center; font-size:12px; color:var(--cyan); margin:0;">精选区间：心中锚点 ↔ AB中点</p>
            <div class="div-btns">
                <button class="btn-div" data-n="3">三分法</button>
                <button class="btn-div" data-n="4">四分法</button>
                <button class="btn-div" data-n="6">六分法</button>
                <button class="btn-div active" data-n="0">自由选点</button>
            </div>
            <div class="confirm-bar">
                <button class="btn-confirm" id="btn-confirm">确定位点</button>
                <button class="btn-cancel" id="btn-cancel">取消并退出</button>
            </div>
        </div>
    </div>

    <div class="panel right-panel">
        <h3 style="font-size:13px; color:var(--text-sub); border-bottom:1px solid #333; padding-bottom:10px; font-weight:800; letter-spacing:1px;">HISTORY LOGS</h3>
        <div class="history-list" id="hist"></div>
    </div>
    <a href="https://space.bilibili.com/1534330" class="footer" target="_blank">灵敏度推广、网页制作者：西岛海</a>
</div>

<script>
    const PHI = 0.6180339887;
    let isAdvancedMode = false;
    let iMin, iMax, cMin, cMax, targetVal = null, step = 1;
    let anchorActive = false, isManualMode = false, tempSelectedVal = null;
    let stack = [];
    let vMin, vMax;
    let animationDisabled = false;
    let isAnimating = false;

    const $ = id => document.getElementById(id);
    const f = n => Number(n).toFixed(3);

    function getPct(val) {
        if (vMax === vMin) return 0;
        return ((val - vMin) / (vMax - vMin)) * 100;
    }

    function init() {
        iMin = parseFloat($('in-min').value) || 0;
        iMax = parseFloat($('in-max').value) || 100;
        if (iMin >= iMax) { alert("范围无效：下限需小于上限"); return; }
        cMin = iMin; cMax = iMax;
        vMin = iMin; vMax = iMax;
        anchorActive = false; 
        targetVal = null; 
        step = 1; 
        stack = [];
        $('hist').innerHTML = '';
        $('btn-undo').disabled = true;
        $('in-target').value = '';
        updateUI();
    }

    function updateUI() {
        const range = cMax - cMin;
        const pA = cMin + (1 - PHI) * range;
        const pB = cMin + PHI * range;

        $('val-a').innerText = f(pA);
        $('val-b').innerText = f(pB);
        $('txt-min').innerText = f(cMin);
        $('txt-max').innerText = f(cMax);
        $('txt-step').innerText = `STEP ${step}`;

        $('bar-active').style.left = getPct(cMin) + '%';
        $('bar-active').style.width = (getPct(cMax) - getPct(cMin)) + '%';
        $('ptr-a').style.left = getPct(pA) + '%';
        $('ptr-b').style.left = getPct(pB) + '%';
        $('lab-a').style.left = getPct(pA) + '%';
        $('lab-b').style.left = getPct(pB) + '%';

        if (getPct(pB) - getPct(pA) < 14) {
            $('lab-a').classList.add('shift-left');
            $('lab-b').classList.add('shift-right');
        } else {
            $('lab-a').classList.remove('shift-left');
            $('lab-b').classList.remove('shift-right');
        }

        // 高级模式下的锚点与参考点渲染
        if (isAdvancedMode && anchorActive && targetVal !== null) {
            $('ptr-t').classList.add('visible');
            $('ptr-t').style.left = getPct(targetVal) + '%';
            if (document.activeElement !== $('in-target')) {
                $('in-target').value = f(targetVal);
            }
            $('btn-anchor-toggle').classList.add('active');

            if (isManualMode) {
                const abMid = (pA + pB) / 2;
                const start = Math.min(targetVal, abMid);
                const end = Math.max(targetVal, abMid);
                $('focus-zone').classList.add('visible');
                $('focus-zone').style.left = getPct(start) + '%';
                $('focus-zone').style.width = (getPct(end) - getPct(start)) + '%';
                const activeDiv = parseInt(document.querySelector('.btn-div.active').dataset.n);
                renderDivisionMarks(activeDiv);
            }
        } else {
            $('ptr-t').classList.remove('visible');
            if (document.activeElement !== $('in-target')) {
                $('in-target').value = '';
            }
            $('btn-anchor-toggle').classList.remove('active');
            $('focus-zone').classList.remove('visible');
            $('div-marks-container').innerHTML = '';
        }

        $('btn-undo').disabled = stack.length === 0;
    }

    function renderDivisionMarks(n) {
        const container = $('div-marks-container'); 
        container.innerHTML = '';
        if (n <= 0 || targetVal === null) return;
        const range = cMax - cMin;
        const abMid = (cMin + (1 - PHI) * range + cMin + PHI * range) / 2;
        const start = Math.min(targetVal, abMid);
        const end = Math.max(targetVal, abMid);
        const stepSize = (end - start) / n;
        for (let i = 1; i < n; i++) {
            const val = start + stepSize * i;
            const mark = document.createElement('div');
            mark.className = 'division-mark';
            mark.style.left = getPct(val) + '%';
            container.appendChild(mark);
        }
    }

    function applyZoom(n) {
        if (!anchorActive || targetVal === null || n === 0) {
            vMin = iMin;
            vMax = iMax;
        } else {
            const range = cMax - cMin;
            const abMid = (cMin + (1 - PHI) * range + cMin + PHI * range) / 2;
            const start = Math.min(targetVal, abMid);
            const end = Math.max(targetVal, abMid);
            const pad = (end - start) * 0.35;
            vMin = Math.max(iMin, start - pad);
            vMax = Math.min(iMax, end + pad);
        }
        updateUI();
    }

    function saveState() {
        stack.push({
            cMin, cMax, step,
            targetVal, anchorActive
        });
    }

    function logAction(type, sel, valA, valB, mode = 'normal') {
        const item = document.createElement('div');
        item.className = `history-item is-${mode}`;
        if (mode === 'manual') {
            item.innerHTML = `<b>[精选定点]</b> 最终确认位点 <span class="keep-badge" style="background:var(--purple); color:#fff">${f(sel)}</span>`;
        } else if (mode === 'midpoint') {
            item.innerHTML = `<b>[决策]</b> 取区间中点 <span class="keep-badge" style="background:var(--green); color:#000">${f(sel)}</span>`;
        } else if (mode === 'hybrid') {
            item.innerHTML = `<b>[混合微调]</b> 参考点与中点间 <span class="keep-badge" style="background:var(--cyan); color:#000">${f(sel)}</span>`;
        } else {
            item.innerHTML = `<b>[STEP ${step}]</b> 选择了 <span class="keep-badge" style="background:rgba(${type === 'A' ? '77,171,247' : '255,107,107'},0.2); color:var(--${type === 'A' ? 'blue' : 'red'})">方案 ${type}</span><div style="font-size:11px; opacity:0.6; margin-top:4px">新区间: [${f(cMin)}, ${f(cMax)}]</div>`;
        }
        $('hist').prepend(item);
    }

    function clearAnimResidue() {
        document.querySelectorAll('.crease-line, .discard-part').forEach(el => el.remove());
    }

    function playFoldAnim(type, pFold, discLeft, discWidth, callback) {
        if (isAnimating) return;
        isAnimating = true;
        const track = $('track-box');

        const crease = document.createElement('div');
        crease.className = 'crease-line';
        crease.style.left = pFold + '%';
        track.appendChild(crease);

        const discard = document.createElement('div');
        discard.className = 'discard-part';
        discard.style.left = discLeft + '%';
        discard.style.width = discWidth + '%';
        discard.innerText = '撕掉';
        track.appendChild(discard);

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                discard.style.width = '0%';
                discard.style.opacity = '0';
            });
        });

        setTimeout(() => {
            crease.remove();
            discard.remove();
            isAnimating = false;
            if (callback) callback();
        }, 950);
    }

    function doStep(type) {
        if (isAnimating) return;
        const range = cMax - cMin;
        const pA = cMin + (1 - PHI) * range;
        const pB = cMin + PHI * range;

        let pFold, discLeft, discWidth;
        if (type === 'A') {
            pFold = getPct(pB);
            discLeft = getPct(pB);
            discWidth = getPct(cMax) - getPct(pB);
        } else {
            pFold = getPct(pA);
            discLeft = getPct(cMin);
            discWidth = getPct(pA) - getPct(cMin);
        }

        saveState();

        const proceed = () => {
            if (type === 'A') cMax = pB;
            else cMin = pA;
            step++;
            logAction(type);
            updateUI();
        };

        if (animationDisabled) {
            proceed();
        } else {
            playFoldAnim(type, pFold, discLeft, discWidth, proceed);
        }
    }

    // 模式切换
    $('tab-normal').onclick = () => {
        if (isManualMode) $('btn-cancel').click();
        isAdvancedMode = false;
        $('tab-normal').classList.add('active');
        $('tab-advanced').classList.remove('active');
        $('main-container').classList.remove('is-advanced');
        anchorActive = false;
        targetVal = null;
        vMin = iMin; vMax = iMax;
        updateUI();
    };

    $('tab-advanced').onclick = () => {
        isAdvancedMode = true;
        $('tab-advanced').classList.add('active');
        $('tab-normal').classList.remove('active');
        $('main-container').classList.add('is-advanced');
        updateUI();
    };

    $('btn-a').onclick = () => doStep('A');
    $('btn-b').onclick = () => doStep('B');
    $('btn-mid').onclick = () => {
        if (isAnimating) return;
        logAction('MID', (cMin + cMax) / 2, 0, 0, 'midpoint');
    };

    $('btn-target-mid').onclick = () => {
        if (isAnimating) return;
        if (!anchorActive || targetVal === null) return alert("请先开启心中的参考点 T");
        const range = cMax - cMin;
        const pA = cMin + (1 - PHI) * range;
        const pB = cMin + PHI * range;
        const mid = (targetVal + (pA + pB) / 2) / 2;
        logAction('HYBRID', mid, pA, pB, 'hybrid');
    };

    $('in-target').oninput = function() {
        const val = parseFloat(this.value);
        if (!isNaN(val) && val >= iMin && val <= iMax) {
            targetVal = val;
            anchorActive = true;
        } else {
            anchorActive = false;
            targetVal = null;
        }
        updateUI();
    };

    $('btn-manual-mode').onclick = () => {
        if (!anchorActive || targetVal === null) return alert("请先开启心中参考 T");
        isManualMode = true;
        $('main-container').classList.add('manual-mode-active');
        applyZoom(0);
    };

    $('btn-cancel').onclick = () => {
        isManualMode = false;
        tempSelectedVal = null;
        $('main-container').classList.remove('manual-mode-active');
        $('manual-ptr').style.display = 'none';
        $('float-val').style.display = 'none';
        $('focus-zone').classList.remove('visible');
        $('div-marks-container').innerHTML = '';
        document.querySelectorAll('.btn-div').forEach(b => b.classList.remove('active'));
        document.querySelector('[data-n="0"]').classList.add('active');
        vMin = iMin; vMax = iMax;
        updateUI();
    };

    $('btn-confirm').onclick = () => {
        if (tempSelectedVal === null) return alert("请选定位点");
        logAction('SELECT', tempSelectedVal, 0, 0, 'manual');
        $('btn-cancel').click();
    };

    document.querySelectorAll('.btn-div').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.btn-div').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            applyZoom(parseInt(btn.dataset.n));
        };
    });

    $('btn-undo').onclick = () => {
        if (stack.length === 0) return;
        if (isAnimating) {
            clearAnimResidue();
            isAnimating = false;
        }
        const last = stack.pop();
        cMin = last.cMin;
        cMax = last.cMax;
        step = last.step;
        targetVal = last.targetVal;
        anchorActive = last.anchorActive;
        const hist = $('hist');
        if (hist.firstChild) hist.removeChild(hist.firstChild);
        clearAnimResidue();
        vMin = iMin; vMax = iMax;
        updateUI();
    };

    $('btn-anchor-toggle').onclick = () => {
        anchorActive = !anchorActive;
        if (anchorActive && targetVal === null) targetVal = (cMin + cMax) / 2;
        updateUI();
    };

    $('btn-reset').onclick = init;
    $('in-min').onchange = init;
    $('in-max').onchange = init;

    let isDragging = false;
    function handleTrackInteract(e) {
        // 一般模式下不允许点击轨道修改参考点
        if (!isAdvancedMode && !isManualMode) return;

        const rect = $('track-box').getBoundingClientRect();
        let clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        let pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        let val = vMin + pct * (vMax - vMin);

        if (isManualMode) {
            const n = parseInt(document.querySelector('.btn-div.active').dataset.n);
            if (n > 0 && targetVal !== null) {
                const range = cMax - cMin;
                const abMid = (cMin + (1 - PHI) * range + cMin + PHI * range) / 2;
                const start = Math.min(targetVal, abMid);
                const end = Math.max(targetVal, abMid);
                const stepSize = (end - start) / n;
                let closest = Math.round((val - start) / stepSize);
                val = start + Math.max(0, Math.min(n, closest)) * stepSize;
            }
            tempSelectedVal = val;
            const valPct = getPct(val);
            $('manual-ptr').style.display = 'block';
            $('manual-ptr').style.left = valPct + '%';
            $('float-val').style.display = 'block';
            $('float-val').style.left = valPct + '%';
            $('float-val').innerText = f(val);
        } else if (isAdvancedMode) {
            if (val >= iMin && val <= iMax) {
                targetVal = val;
                anchorActive = true;
                updateUI();
            }
        }
    }

    $('track-box').addEventListener('mousedown', (e) => { isDragging = true; handleTrackInteract(e); });
    window.addEventListener('mouseup', () => isDragging = false);
    $('track-box').addEventListener('mousemove', (e) => { if (isDragging) handleTrackInteract(e); });
    $('track-box').addEventListener('touchstart', (e) => { isDragging = true; handleTrackInteract(e); }, {passive: true});
    window.addEventListener('touchend', () => isDragging = false);
    $('track-box').addEventListener('touchmove', (e) => { if (isDragging) handleTrackInteract(e); }, {passive: true});

    // 动画开关控制
    $('btn-toggle-anim').onclick = () => {
        animationDisabled = !animationDisabled;
        const btn = $('btn-toggle-anim');
        const indicator = $('anim-indicator');
        const label = $('anim-label');
        if (animationDisabled) {
            btn.classList.add('off');
            indicator.style.background = '#555';
            label.innerText = '动画关';
            $('main-container').classList.add('no-anim');
        } else {
            btn.classList.remove('off');
            indicator.style.background = 'var(--green)';
            label.innerText = '动画开';
            $('main-container').classList.remove('no-anim');
        }
    };

    // 初始化运行
    init();
</script>
</body>
</html>
