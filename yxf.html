ter; \n            margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px;\n        }\n        .header h2 { font-size: 24px; letter-spacing: 1px; font-weight: 600; }\n        .mode-badge { \n            font-size: 14px; padding: 6px 12px; border-radius: 6px; font-weight: bold; text-transform: uppercase; \n        }\n\n        /* 主题切换 */\n        body.theme-gold .mode-badge { background: var(--gold-dim); color: var(--gold); }\n        body.theme-fibo .mode-badge { background: var(--fibo-dim); color: var(--fibo); }\n\n        /* 控制面板 */\n        .controls { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 15px; margin-bottom: 25px; }\n        .input-group { background: var(--panel-bg); padding: 12px 15px; border-radius: 10px; border: 1px solid var(--border); }\n        .input-group label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 8px; }\n        .input-group input { \n            background: transparent; border: none; color: #fff; width: 100%; font-size: 18px; font-weight: bold; outline: none; \n        }\n\n        .btn { \n            border: 1px solid var(--border); background: var(--panel-bg); color: #fff; \n            border-radius: 10px; cursor: pointer; transition: 0.2s; display: grid; place-items: center;\n            font-size: 16px;\n        }\n        .btn:hover { background: rgba(255,255,255,0.15); border-color: #666; }\n        .btn:active { transform: scale(0.98); }\n        .btn-mode { height: 100%; padding: 0 20px; font-size: 16px; }\n        .btn-mode.active { border-color: currentColor; background: rgba(255,255,255,0.08); box-shadow: 0 0 10px rgba(0,0,0,0.2); }\n\n        /* 可视化核心区 */\n        .viz-box { \n            background: #080808; border: 1px solid var(--border); border-radius: 14px; \n            padding: 70px 30px 50px; position: relative; margin-bottom: 25px;\n        }\n        \n        .track { width: 100%; height: 8px; background: #333; position: relative; border-radius: 4px; }\n        .range-highlight { \n            position: absolute; height: 100%; background: rgba(255,255,255,0.25); \n            top: 0; transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);\n            border-radius: 4px;\n        }\n\n        .needle {\n            position: absolute; top: -24px; width: 2px; height: 56px; \n            background: #fff; z-index: 10; cursor: default;\n            transition: left 0.5s cubic-bezier(0.2, 1, 0.3, 1);\n        }\n        .needle::before {\n            content: attr(data-val); position: absolute; top: -30px; left: 50%; transform: translateX(-50%);\n            font-size: 14px; background: #222; padding: 4px 8px; border-radius: 6px; border: 1px solid #444; white-space: nowrap;\n            font-family: 'Consolas', monospace;\n        }\n        .needle::after {\n            content: attr(data-role); position: absolute; bottom: -28px; left: 50%; transform: translateX(-50%);\n            font-size: 16px; font-weight: bold;\n        }\n        \n        .needle.role-A { background: var(--blue); box-shadow: 0 0 20px var(--blue); }\n        .needle.role-A::before { color: var(--blue); border-color: var(--blue); }\n        .needle.role-A::after { color: var(--blue); content: 'A'; }\n        \n        .needle.role-B { background: var(--red); box-shadow: 0 0 20px var(--red); }\n        .needle.role-B::before { color: var(--red); border-color: var(--red); }\n        .needle.role-B::after { color: var(--red); content: 'B'; }\n\n        /* 仪表盘 */\n        .dashboard { \n            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; \n            margin-bottom: 25px; font-family: 'Consolas', monospace;\n        }\n        .dash-item { background: var(--panel-bg); padding: 15px; border-radius: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }\n        .dash-label { font-size: 12px; color: var(--text-sub); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }\n        .dash-val { font-size: 18px; font-weight: bold; color: #fff; }\n\n        /* 决策区 */\n        .decision-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 20px; }\n        .choice-card {\n            background: linear-gradient(180deg, #2a2a2a, #1a1a1a);\n            border: 1px solid var(--border); border-radius: 14px;\n            padding: 25px; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden;\n        }\n        .choice-card:hover { transform: translateY(-3px); border-color: #777; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }\n        .choice-card:active { transform: translateY(-1px); }\n        .choice-card.left { border-bottom: 5px solid var(--blue); }\n        .choice-card.right { border-bottom: 5px solid var(--red); }\n        \n        .choice-title { font-size: 15px; color: var(--text-sub); margin-bottom: 8px; }\n        .choice-val { font-size: 28px; font-weight: bold; font-family: 'Consolas', monospace; }\n\n        /* 计算解释区 */\n        .calc-explain {\n            background: rgba(0,0,0,0.3);\n            border: 1px dashed var(--border);\n            border-radius: 10px;\n            padding: 15px;\n            font-family: 'Consolas', monospace;\n            font-size: 14px;\n            color: var(--text-sub);\n            line-height: 1.6;\n        }\n        .calc-highlight { color: #fff; font-weight: bold; }\n\n        /* 表格样式 (历史记录) */\n        .table-container { flex: 1; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; background: #111; }\n        table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }\n        th { position: sticky; top: 0; background: #222; padding: 15px; font-weight: 600; color: var(--text-sub); z-index: 2; border-bottom: 1px solid var(--border); }\n        td { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #ddd; font-family: 'Consolas', monospace; }\n        tr:hover { background: rgba(255,255,255,0.04); }\n        \n        .col-idx { width: 60px; color: var(--text-sub); text-align: center; }\n        .tag { padding: 4px 8px; border-radius: 5px; font-size: 12px; font-weight: bold; }\n        .tag.blue { background: rgba(41, 121, 255, 0.2); color: var(--blue); }\n        .tag.red { background: rgba(255, 23, 68, 0.2); color: var(--red); }\n        .tag.dim { background: rgba(255,255,255,0.1); color: #888; }\n        \n        /* 结果层 */\n        .overlay { \n            position: absolute; inset: 0; background: rgba(0,0,0,0.85); \n            display: flex; flex-direction: column; align-items: center; justify-content: center;\n            opacity: 0; pointer-events: none; transition: 0.3s; z-index: 100;\n            backdrop-filter: blur(8px); border-radius: 14px;\n        }\n        .overlay.active { opacity: 1; pointer-events: all; }\n\n        /* 作者栏 */\n        .author-badge {\n            position: fixed;\n            bottom: 20px;\n            right: 20px;\n            background: rgba(30, 30, 30, 0.9);\n            border: 1px solid var(--border);\n            padding: 8px 16px;\n            border-radius: 30px;\n            font-size: 13px;\n            color: var(--text-sub);\n            text-decoration: none;\n            transition: 0.3s;\n            box-shadow: 0 5px 15px rgba(0,0,0,0.3);\n            z-index: 999;\n            display: flex;\n            align-items: center;\n            gap: 8px;\n        }\n        .author-badge:hover {\n            background: #fff;\n            color: #000;\n            transform: translateY(-2px);\n        }\n    </style>\n</head>\n<body class=\"theme-gold\">\n\n<div class=\"layout\">\n    <div class=\"card\">\n        <div class=\"header\">\n            <div>\n                <h2 id=\"title-text\">0.618 优选法</h2>\n                <div style=\"font-size:14px; color:var(--text-sub); margin-top:6px;\">基于几何分形的单峰函数极值搜索</div>\n            </div>\n            <div class=\"mode-badge\" id=\"mode-display
