<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>0.618 优选法计算器 Pro</title>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --panel-bg: rgba(22, 22, 26, 0.95);
            --border-color: #2a2a2e;
            --text-main: #f0f0f0;
            --text-sub: #88888b;
            --yellow: #ffd700;
            --yellow-dark: #b89b1c;
            --blue: #4dabf7;
            --red: #ff6b6b;
            --green: #00ff88;
            --track-bg: #3d3b26;
            --radius: 14px;
            --spring-easing: cubic-bezier(0.34, 1.56, 0.64, 1);
            --smooth-easing: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "SF Pro Display", "PingFang SC", sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 2px 2px, rgba(255,255,255,0.03) 1px, transparent 0),
                radial-gradient(circle at 50% 50%, #1a1a22 0%, #0b0b0e 100%);
            background-size: 24px 24px, 100% 100%;
            color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px; overflow-x: hidden;
            position: relative;
        }

        .container {
            display: flex; gap: 25px; width: 100%; max-width: 1100px; z-index: 1;
            position: relative; /* 为 PC 徽章定位提供基准 */
        }

        @media (max-width: 900px) {
            .container { flex-direction: column; align-items: center; padding-top: 10px; padding-bottom: 60px; }
            body { align-items: flex-start; overflow-y: auto; }
            .left-panel, .right-panel { width: 100% !important; min-width: unset !important; }
            .right-panel { max-height: 500px !important; }
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius); padding: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
        }

        .left-panel { flex: 1.8; display: flex; flex-direction: column; gap: 24px; }
        .right-panel { flex: 1; min-width: 340px; display: flex; flex-direction: column; overflow: hidden; max-height: 85vh; }

        .header h1 { font-size: 24px; letter-spacing: -0.5px; }
        .header h1 span { color: var(--yellow); }
        .header p { color: var(--text-sub); font-size: 13px; margin-top: 4px; opacity: 0.8; }

        .input-section {
            display: flex; gap: 15px; align-items: flex-end;
            background: rgba(255,255,255,0.02);
            padding: 15px; border-radius: var(--radius); border: 1px solid var(--border-color);
        }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .input-group label { color: var(--text-sub); font-size: 11px; text-transform: uppercase; font-weight: bold; }
        .input-group input {
            background-color: #000; border: 1px solid #333; border-radius: 8px;
            color: var(--yellow); font-size: 18px; font-weight: bold;
            padding: 10px; outline: none; transition: 0.3s; width: 100%;
        }
        
        .btn-refresh {
            background: #252525; border: 1px solid #444; color: #fff;
            width: 46px; height: 46px; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.3s; flex-shrink: 0;
        }
        .btn-refresh:hover { transform: rotate(180deg); border-color: var(--yellow); }

        .visualizer-section {
            border: 1px solid var(--border-color); border-radius: var(--radius);
            padding: 55px 25px 45px 25px; position: relative;
            background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, transparent 100%);
        }
        .marker-label {
            position: absolute; font-size: 12px; font-weight: bold; top: 15px;
            transform: translateX(-50%);
            transition: left 0.7s var(--spring-easing), transform 0.5s var(--smooth-easing);
            white-space: nowrap;
        }
        .marker-label.a { color: var(--blue); }
        .marker-label.b { color: var(--red); }
        .marker-label.shift-left { transform: translateX(calc(-100% - 6px)); }
        .marker-label.shift-right { transform: translateX(6px); }

        .track-container { position: relative; height: 8px; margin: 15px 0; }
        .track-bg { position: absolute; width: 100%; height: 100%; background: #222; border-radius: 10px; }
        .track-active {
            position: absolute; height: 100%; background: var(--track-bg); border-radius: 10px;
            transition: left 0.7s var(--spring-easing), width 0.7s var(--spring-easing);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
        }
        .marker {
            position: absolute; top: -14px; width: 3px; height: 36px; border-radius: 2px;
            transform: translateX(-50%); transition: left 0.7s var(--spring-easing); z-index: 10;
        }
        .marker.a { background: var(--blue); box-shadow: 0 0 10px var(--blue); }
        .marker.b { background: var(--red); box-shadow: 0 0 10px var(--red); }

        .bounds-labels {
            display: flex; justify-content: space-between;
            color: var(--text-sub); font-size: 14px; margin-top: 25px;
            position: relative; font-family: 'Consolas', monospace;
        }
        .bounds-labels span { color: var(--text-main); font-weight: bold; }
        .step-tag {
            position: absolute; left: 50%; transform: translateX(-50%);
            background: var(--yellow-dark); color: #000; padding: 2px 10px;
            border-radius: 20px; font-size: 11px; font-weight: 800;
        }

        .actions-section { display: flex; gap: 15px; }
        .action-card {
            flex: 1; background: #1e1e24; border: 1px solid var(--border-color);
            border-radius: var(--radius); padding: 18px;
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; transition: 0.4s var(--spring-easing);
            position: relative; overflow: hidden;
        }
        .action-card:hover { transform: translateY(-4px); border-color: #555; background: #25252d; }
        .action-card:active { transform: scale(0.96); }
        .action-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; }
        .action-card.a::before { background: var(--blue); }
        .action-card.b::before { background: var(--red); }
        .action-title { font-size: 12px; font-weight: bold; margin-bottom: 8px; opacity: 0.9; }
        .action-value { font-size: 32px; font-weight: bold; font-family: 'Consolas', monospace; letter-spacing: -1px; }

        .aux-btns { display: flex; flex-direction: column; gap: 12px; }
        .btn-undo, .btn-mid {
            padding: 14px; border-radius: var(--radius); cursor: pointer; transition: 0.3s; 
            font-size: 13px; font-weight: bold; display: flex; align-items: center; justify-content: center;
        }
        .btn-undo { background: transparent; border: 1px dashed #444; color: var(--text-sub); }
        .btn-undo:disabled { opacity: 0.2; }
        .btn-mid { background: #2d2d35; border: 1px solid #444; color: #e0e0e0; }
        .btn-mid:hover { border-color: var(--green); color: var(--green); background: #33333d; }

        .history-list { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 14px; margin-top: 15px; padding-right: 5px; }
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .history-item {
            padding: 16px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px; font-size: 13px; line-height: 1.6;
            animation: slideUp 0.4s var(--smooth-easing) forwards;
            width: 100%; box-sizing: border-box;
        }
        .history-item.is-midpoint { border: 1px solid var(--green); background: rgba(0, 255, 136, 0.05); }
        .history-item b { color: var(--yellow); font-family: 'Consolas', monospace; }
        .keep-badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-weight: bold; font-family: 'Consolas', monospace; margin: 0 2px; }
        .keep-badge.a { background: rgba(77, 171, 247, 0.2); color: var(--blue); }
        .keep-badge.b { background: rgba(255, 107, 107, 0.2); color: var(--red); }
        .keep-badge.mid { background: var(--green); color: #000; }
        
        .hist-detail { margin-top: 6px; color: var(--text-main); }
        .hist-range-box { margin-top: 4px; color: var(--text-sub); font-size: 11px; font-family: 'Consolas', monospace; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* 作者信息修复：PC 与 移动端的分离处理 */
        .footer {
            text-decoration: none; display: block; padding: 15px;
            font-size: 12px; color: var(--text-sub); text-align: center;
            transition: 0.3s;
        }
        
        @media (min-width: 901px) {
            /* PC 端：徽标悬浮在容器右下方，不随页面滚动乱动，也不遮挡侧边栏 */
            .footer {
                position: absolute;
                bottom: -45px;
                right: 0;
                background: rgba(0, 0, 0, 0.6);
                backdrop-filter: blur(10px);
                border: 1px solid #333;
                border-radius: 30px;
                padding: 8px 20px;
                z-index: 100;
                width: auto;
            }
        }
        
        @media (max-width: 900px) {
            /* 移动端：显示在页面最底部 */
            .footer {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                background: rgba(11, 11, 14, 0.9);
                border-top: 1px solid var(--border-color);
                z-index: 100;
            }
        }
        .footer:hover { color: var(--yellow); border-color: var(--yellow); }

    </style>
</head>
<body>

<div class="container">
    <div class="panel left-panel">
        <div class="header">
            <h1>Jack Kiefer/华罗庚 <span>0.618 优选法</span></h1>
            <p>动态缩减空间，精准寻优</p>
        </div>

        <div class="input-section">
            <div class="input-group">
                <label>下限 Min</label>
                <input type="number" id="in-min" value="1" step="any">
            </div>
            <div class="input-group">
                <label>上限 Max</label>
                <input type="number" id="in-max" value="3" step="any">
            </div>
            <button class="btn-refresh" id="btn-reset" title="重置">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
        </div>

        <div class="visualizer-section">
            <div class="marker-label a" id="lab-a">方案 A</div>
            <div class="marker-label b" id="lab-b">方案 B</div>
            <div class="track-container">
                <div class="track-bg"></div>
                <div class="track-active" id="bar-active"></div>
                <div class="marker a" id="ptr-a"></div>
                <div class="marker b" id="ptr-b"></div>
            </div>
            <div class="bounds-labels">
                <span id="txt-min">1.000</span>
                <div class="step-tag" id="txt-step">STEP 1</div>
                <span id="txt-max">3.000</span>
            </div>
        </div>

        <div class="actions-section">
            <div class="action-card a" id="btn-a">
                <div class="action-title" style="color:var(--blue)">保留方案 A (左)</div>
                <div class="action-value" id="val-a">1.764</div>
            </div>
            <div class="action-card b" id="btn-b">
                <div class="action-title" style="color:var(--red)">保留方案 B (右)</div>
                <div class="action-value" id="val-b">2.236</div>
            </div>
        </div>

        <div class="aux-btns">
            <button class="btn-undo" id="btn-undo" disabled>撤销上一步操作</button>
            <button class="btn-mid" id="btn-mid">无法再选，取中点</button>
        </div>
    </div>

    <div class="panel right-panel">
        <h3 style="font-size:14px; color:var(--text-sub); border-bottom:1px solid #333; padding-bottom:12px; font-weight: 800; letter-spacing: 1px;">HISTORY LOGS</h3>
        <div class="history-list" id="hist"></div>
    </div>

    <!-- PC 徽标会相对于此 container 定位 -->
    <a href="https://space.bilibili.com/1534330" target="_blank" class="footer">
        灵敏度推广使用、网页制作者：西岛海
    </a>
</div>
