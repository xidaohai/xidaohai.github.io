<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优选法（0.618法）</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --card-bg: rgba(32, 32, 32, 0.98);
            --card-border: rgba(255, 255, 255, 0.12);
            --accent-blue: #64B5F6;   /* A点固定色 */
            --accent-red: #FF5252;    /* B点固定色 */
            --accent-gold: #FFD700;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', "Microsoft YaHei", sans-serif; }
        body { background: var(--bg-primary); color: var(--text-primary); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 30px; }

        .main-layout { display: flex; gap: 30px; width: 100%; max-width: 1200px; height: 750px; }
        .v28-card { background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 24px; padding: 40px; box-shadow: 0 30px 60px rgba(0,0,0,0.7); display: flex; flex-direction: column; }
        .tool-side { flex: 1.6; }
        .history-side { flex: 0.9; background: rgba(20, 20, 20, 0.9); }

        .header h3 { color: var(--accent-gold); font-size: 32px; margin-bottom: 12px; }
        .header p { font-size: 16px; color: var(--text-secondary); margin-bottom: 30px; line-height: 1.5; }

        .config-bar { display: grid; grid-template-columns: 1fr 1fr auto; gap: 20px; margin-bottom: 40px; }
        .input-item label { display: block; font-size: 14px; color: var(--accent-gold); margin-bottom: 10px; font-weight: bold; }
        input { width: 100%; background: #000; border: 2px solid var(--card-border); border-radius: 12px; padding: 18px; color: white; font-size: 22px; font-weight: bold; font-family: 'Consolas', monospace; }

        .btn-reset { background: rgba(255, 255, 255, 0.08); border: 2px solid var(--card-border); color: var(--text-primary); padding: 0 25px; border-radius: 12px; cursor: pointer; transition: 0.3s; font-size: 20px; }
        .btn-reset:hover { background: var(--accent-gold); color: #000; }

        /* 轨道可视化 */
        .viz-box { background: rgba(0,0,0,0.4); padding: 60px 30px 30px; border-radius: 20px; margin-bottom: 40px; border: 1px solid var(--card-border); position: relative; overflow: hidden; }
        .track { width: 100%; height: 12px; background: #222; border-radius: 6px; position: relative; }
        .bar { position: absolute; height: 100%; background: rgba(255,215,0,0.15); border-radius: 6px; transition: 0.6s cubic-bezier(0.2, 1, 0.3, 1); }
        
        /* 针脚：独立的颜色和动画 */
        .needle { 
            position: absolute; width: 6px; height: 46px; top: -17px; 
            transform: translateX(-50%); 
            /* 关键：left 属性的过渡动画，允许穿插 */
            transition: left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); 
            z-index: 5; border-radius: 3px;
        }
        .needle::after { 
            content: attr(data-label); position: absolute; top: -32px; left: 50%; 
            transform: translateX(-50%); font-size: 12px; white-space: nowrap; font-weight: 800; 
        }

        #ptr-L { background: var(--accent-blue); box-shadow: 0 0 15px var(--accent-blue); }
        #ptr-R { background: var(--accent-red); box-shadow: 0 0 15px var(--accent-red); }

        .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .btn-choice {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a); 
            border: 2px solid var(--card-border); border-radius: 20px;
            padding: 40px 20px; cursor: pointer; transition: 0.3s; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .btn-choice:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        .btn-choice .val { font-size: 42px; font-weight: 900; margin-top: 15px; font-family: 'Consolas', monospace; }
        .btn-choice span:first-child { font-size: 16px; letter-spacing: 2px; color: var(--text-secondary); font-weight: bold; }

        .history-list { flex: 1; overflow-y: auto; margin-top: 20px; padding-right: 10px; }
        .history-item { padding: 15px; border-bottom: 1px solid var(--card-border); font-size: 15px; display: flex; justify-content: space-between; align-items: center; }

        #res-view h1 { font-size: 110px; font-weight: 900; color: var(--accent-gold); }
        .author-tag { position: fixed; bottom: 25px; right: 30px; font-size: 16px; color: var(--text-secondary); background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 40px; border: 1px solid var(--card-border); }
        .author-tag b { color: var(--accent-gold); }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="main-layout">
    <div class="v28-card tool-side">
        <div class="header">
            <h3> 华罗庚0.618优选法 </h3>
        </div>

        <div class="config-bar">
            <div class="input-item"><label>下限 (L)</label><input type="number" id="gs-min" value="35" step="0.1"></div>
            <div class="input-item"><label>上限 (R)</label><input type="number" id="gs-max" value="75" step="0.1"></div>
            <button class="btn-reset" onclick="gsApp.reset()"><i class="fas fa-sync-alt"></i></button>
        </div>

        <div id="play-view">
            <div class="viz-box">
                <div class="track">
                    <div id="gs-bar" class="bar"></div>
                    <!-- 两个针脚，完全独立，允许交叉 -->
                    <div id="ptr-L" class="needle" data-label="选项 A"></div>
                    <div id="ptr-R" class="needle" data-label="选项 B"></div>
                </div>
                <p id="step-msg" style="text-align:center; font-size:16px; color:var(--accent-gold); margin-top:25px; font-weight:bold;"></p>
            </div>

            <div class="choice-grid">
                <!-- 按钮颜色和针脚一一对应 -->
                <button class="btn-choice" onclick="gsApp.go('L')" style="border-bottom: 4px solid var(--accent-blue)">
                    <span style="color:var(--accent-blue)">选项 A (蓝)</span>
                    <span id="val-L" class="val">-</span>
                </button>
                <button class="btn-choice" onclick="gsApp.go('R')" style="border-bottom: 4px solid var(--accent-red)">
                    <span style="color:var(--accent-red)">选项 B (红)</span>
                    <span id="val-R" class="val">-</span>
                </button>
            </div>
        </div>

        <div id="res-view" class="hidden" style="text-align:center; padding-top:20px;">
            <p style="color:var(--text-secondary); font-size:20px; font-weight:bold;">校准完成！最佳灵敏度</p>
            <h1 id="final-res">-</h1>
            <button class="btn-reset" style="height:60px; padding:0 50px;" onclick="gsApp.reset()">重新开始</button>
        </div>
    </div>

    <div class="v28-card history-side">
        <div class="header" style="border-bottom: 2px solid var(--accent-gold); padding-bottom: 10px;">
            <h3 style="font-size:24px;"><i class="fas fa-history"></i> 路径追踪</h3>
        </div>
        <div id="history-container" class="history-list"></div>
    </div>
</div>

<div class="author-tag">
    <i class="fas fa-terminal"></i> 
    灵敏度推广使用、网页制作者：
    <a href="https://space.bilibili.com/1534330" target="_blank" style="color: inherit; text-decoration: none;">
        <b>西岛海_XLM</b>
    </a>
</div>
