: none; transform: rotate(-90deg);\n            width: 150px; height: 5px; background: var(--gjjz-secondary-bg);\n            border-radius: 5px; outline: none; margin: 0; position: absolute;\n            top: 50%; left: 50%; margin-top: -2.5px; margin-left: -75px;\n        }\n        input[type=\"range\"].vertical-custom::-webkit-slider-thumb {\n            -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;\n            background: var(--gjjz-accent-color); cursor: pointer; box-shadow: 0 0 8px var(--gjjz-glow-color);\n        }\n\n        .module-1 input[type=\"range\"].vertical-custom::-webkit-slider-thumb { background: var(--module1-color); }\n        .module-2 input[type=\"range\"].vertical-custom::-webkit-slider-thumb { background: var(--module2-color); }\n        .module-3 input[type=\"range\"].vertical-custom::-webkit-slider-thumb { background: var(--module3-color); }\n        .module-4 input[type=\"range\"].vertical-custom::-webkit-slider-thumb { background: var(--module4-color); }\n\n        .slider-markers { display: flex; flex-direction: column; justify-content: space-between; height: 150px; margin-left: 10px; }\n        .slider-markers span { font-size: 0.7rem; color: var(--gjjz-text-color); opacity: 0.6; }\n        .ratio-display { font-size: 0.9rem; color: var(--gjjz-text-color); width: 50px; text-align: right; }\n\n        .gjjz-results {\n            background: var(--gjjz-secondary-bg); border-radius: 10px; padding: 15px;\n            margin-top: 25px; border: 1px solid var(--gjjz-border-color);\n        }\n        .result-item { display: flex; justify-content: space-between; margin: 10px 0; }\n        .result-label { font-weight: 500; } /* 复用了 class名，但颜色继承父级 */\n        .gjjz-results .result-value { font-weight: 600; }\n\n        .module-1 .result-value { color: var(--module1-color); }\n        .module-2 .result-value { color: var(--module2-color); }\n        .module-3 .result-value { color: var(--module3-color); }\n        .module-4 .result-value { color: var(--module4-color); }\n\n        .formula-note {\n            font-size: 0.8rem; margin-top: 25px; padding: 10px;\n            background: rgba(0, 0, 0, 0.2); border-radius: 8px;\n            border-left: 3px solid var(--gjjz-accent-color); color: var(--gjjz-text-color);\n        }\n        body.gjjz-mode.style-2 .formula-note { background: rgba(0, 0, 0, 0.3); }\n\n        .module-1 .formula-note { border-left-color: var(--module1-color); }\n        .module-2 .formula-note { border-left-color: var(--module2-color); }\n        .module-3 .formula-note { border-left-color: var(--module3-color); }\n        .module-4 .formula-note { border-left-color: var(--module4-color); }\n\n        .separator { width: 100%; height: 1px; background: var(--gjjz-border-color); margin: 20px 0; }\n\n        @media (max-width: 900px) {\n            .container-gjjz { flex-direction: column; padding-left: 0; /* 手机模式取消左侧偏移，否则会偏右 */ }\n            .custom-vertical-slider { height: 150px; }\n            .vertical-title {\n                position: static; transform: none; text-align: center;\n                writing-mode: horizontal-tb; margin-bottom: 20px;\n            }\n        }\n\n        .lock-button { cursor: pointer; width: 18px; height: 18px; fill: var(--gjjz-text-color); opacity: 0.6; }\n        body.gjjz-mode.style-2 .lock-button { fill: var(--gjjz-accent-color); }\n        .lock-button:hover { opacity: 1; }\n\n        .author-info {\n            position: absolute; bottom: 20px; right: 20px; z-index: 10;\n            background: rgba(40, 40, 50, 0.8); border: 1px solid rgba(100, 100, 130, 0.4);\n            padding: 10px 15px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);\n            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);\n            font-size: 0.9rem; transition: all 0.3s ease;\n        }\n        .author-info a { color: var(--gjjz-accent-color); text-decoration: none; font-weight: 600; text-shadow: 0 0 5px var(--gjjz-glow-color); }\n        .author-info a:hover { color: #fff; text-shadow: 0 0 10px #fff; }\n\n    </style>\n</head>\n<body class=\"bdf-mode\">\n\n    <button id=\"main-view-switch\">切换至手部校准工具</button>\n\n    <div id=\"view-bdf\">\n        <div class=\"container-bdf\">\n            <div class=\"bdf-header\">\n                <!-- 更新后的标题 -->\n                <h1>西岛海 · 618公式</h1>\n                <p>三阶公式 + 生理适配一站式工具</p>\n            </div>\n        \n            <div class=\"variable-explanation-card\">\n                <h2><i class=\"fas fa-info-circle\"></i> 变量说明</h2>\n                <table class=\"variable-table\">\n                    <thead>\n                         <tr>\n                            <th>变量</th>\n                            <th>定义</th>\n                            <th>得值关键</th>\n                        </tr>\n                     </thead>\n                    <tbody>\n                        <tr>\n                            <td>变量 X</td>\n                            <td>固定手腕以最大幅度摆动，准星恰好经过目标大小的cm/360°灵敏度。</td>\n                            <td>①.摆动手时请放松 ②.cm/360°反复调整 ③.使得准星划过目标大小时，不多不少</td>\n                         </tr>\n                        <tr>\n                            <td>变量 Y</td>\n                            <td>固定手腕以最大幅度摆动，准星恰好经过常用甩枪距离的cm/360°灵敏度。</td>\n                            <td>①.同上②.同上 ③.使得准星划过常用甩枪距离，不多不少（相当于准星移至目标中心点）</td>\n                        </tr>\n                        <tr>\n                            <td>光腕长度 L</td>\n                            <td>手指尖向上，测量：垂直于【腕部下线】与鼠标光口之间的距离。（如左下角图）</td>\n                            <td>鼠标不必也垂直，随你个人握法。若想精确，可以注意光口拍照处。</td>\n                         </tr>\n                    </tbody>\n                </table>\n            </div>\n            \n            <div class=\"card\">\n                <h2><i class=\"fas fa-calculator\"></i> 主参数输入 </h2>\n                <div class=\"input-row\" style=\"margin-top: 15px;\">\n                    <div class=\"input-group\">\n                        <label>变量 X cm/360°（一般在500-5000之间）（常见于1000-4000之间）:</label>\n                        <input type=\"number\" id=\"x\" value=\"4000\">\n                    </div>\n                    <div class=\"input-group\">\n                        <label>变量 Y cm/360°（一般在20-4000之间）（常见于100-1000之间）:</label>\n                        <input type=\"number\" id=\"y\" value=\"200\">\n                    </div>\n                    <div class=\"input-group\">\n                        <label style=\"color: var(--accent-gold);\">光腕全长 L cm (常见于11.5cm左右):</label>\n                        <input type=\"number\" id=\"thumb_l\" value=\"11.5\" step=\"0.01\" class=\"highlight-input\">\n                    </div>\n                </div>\n                <button class=\"btn-primary\" onclick=\"calculateAll()\">执行全维度计算</button>\n            </div>\n        \n            <div id=\"resultsArea\"></div>\n\n            <!-- 新增的镜像逻辑说明 -->\n            <div class=\"card\">\n                <p style=\"color: var(--text-secondary); font-size: 0.9rem;\">\n                   旧公式：①√X起源值、快速 ②√(X+Y)中速 ③√X+√Y慢速（可以①为轴心得②③镜像值）\n                </p>\n            </div>\n     \n            <div class=\"card\">\n                <h3 style=\"color: var(--text-secondary); font-size: 1rem; margin-bottom: 10px;\">公式逻辑说明</h3>\n                <p style=\"color: var(--text-secondary); font-size: 0.9rem;\">\n                    1. <strong>左侧倍率</strong>：直接乘在 X、Y 的计算结果上，用于整体调节手感比例。<br>\n                    2. <strong>中间结果</strong>：基于 X、Y 和倍率计算出的理论 cm/360° 值。<br>\n                    3. <strong>右侧三阶</strong>：引用我三阶校准法(Phase 3)的逻辑。是 cm/360°±45° 的结果。<br>\n                </p>\n            </div>\n        </div>\n        \n        <div class=\"floating-note-panel\">\n            <h3><i class=\"fas fa-clipboard-list\"></i> 来自于作者的话</h3>\n            <div class=\"note-content\">\n                <p style=\"color: var(--accent-gold); margin-bottom: 10px;\">往往不是不好用，而是没测准</p>\n                <p>1. <strong>固定手腕</strong>：意味着需要【死死按在鼠标垫】上。</p>\n                <p>2. <strong>放松摆动</strong>：意味着让手部摆动角度最大化，但不必故意摆到手很疼。</p>\n                <p>3. <strong>不要动臂</strong>：手臂也要【死死的按着】，务必不要动，哪怕一点。</p>\n                <p>4. <strong>倍率调整</strong>：契合个人手感用的，会调最好。</p>\n                <p>5. <strong>别看只给了一个公式</strong>：由这个【经典值】可以引发出各种经典的、有意义的值。</p>\n                <p>6. <strong>关于此页面的三阶校准</strong>：此是自然可感最小值，意味着可以快速得出你需要的值。</p>\n                <p>7. <strong>配套的校准工具</strong>：一般不必用，此工具在另一个网页。如果你摆动的距离天生比别人小或大，可以用。</p>\n                <p style=\"color: var(--text-secondary); margin-top: 15px;\">—— 西岛海</p>\n            </div>\n        </div>\n        \n        <div class=\"floating-author-link\">\n            <a href=\"https://space.bilibili.com/1534330\" target=\"_blank\">\n                <span>作者 西岛海xlm</span>\n            </a>\n        </div>\n    </div>\n\n    <div id=\"view-gjjz\">\n        <div class=\"vertical-title\">西岛海手部摆动&灵敏度高级校准工具</div>\n        <button id=\"style-switcher\">切换至硬朗风格</button>\n        <div class=\"container-gjjz\">\n            <div class=\"module module-1\">\n                <h2>模块一：计算目标大小度数</h2>\n                \n                <div class=\"gjjz-input-group\">\n                    <label for=\"hand-length-1\">手长 (cm)</label>\n                    <input type=\"number\" id=\"hand-length-1\" min=\"10\" max=\"30\" step=\"0.1\" value=\"18\">\n                </div>\n                \n                <div class=\"gjjz-input-group\">\n                    <label for=\"swing-angle-1\">手的摆动角度 (度)</label>\n                    <input type=\"number\" id=\"swing-angle-1\" min=\"0\" max=\"180\" step=\"1\" value=\"50\">\n                </div>\n        \n                <div class=\"gjjz-input-group\">\n                    <label for=\"x-value-1\">X值 (CM/360°)</label>\n                    <input type=\"number\" id=\"x-value-1\" min=\"1\" max=\"99999\" step=\"0.1\" value=\"4000\">\n                </div>\n              \n                <div class=\"gjjz-input-group\">\n                    <label>光口上下比例位置</label>\n                    <div class=\"custom-vertical-slider\">\n                        <div style=\"display: flex; align-items: center; gap: 5px;\">\n                            <svg id=\"lock-button-1\" class=\"lock-button\" viewBox=\"0 0 16 16\">\n                                <path d=\"M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm2 5V3a3 3 0 1 0-6 0v3H4a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-1zM4 7h8v7H4V7z\"/>\n                            </svg>\n                            <span id=\"light-ratio-display-1\" class=\"ratio-display\">0.69</span>\n                            <input type=\"number\" id=\"wrist-to-light-input-1\" style=\"display: none; width: 80px; text-align: right;\" step=\"0.1\" min=\"0\">\n                        </div>\n                        <div class=\"slider-wrapper\">\n                            <input type=\"range\" id=\"light-ratio-1\" class=\"vertical-custom\" min=\"0\" max=\"16\" step=\"1\" value=\"11\" orient=\"vertical\">\n                        </div>\n      \n                        <div class=\"slider-markers\">\n                            <span>16</span>\n                            <span>12</span>\n                            <span>8</span>\n                            <span>4</span>\n                            <span>0</span>\n                        </div>\n                    </div>\n                </div>\n               \n                <div class=\"gjjz-results\">\n                    <div class=\"result-item\">\n                        <span class=\"result-label\">光口摆动距离:</span>\n                        <span class=\"result-value\" id=\"swing-distance-1\">0 cm</span>\n                    </div>\n             \n                    <div class=\"result-item\">\n                        <span class=\"result-label\">目标大小度数:</span>\n                        <span class=\"result-value\" id=\"target-degree-1\">0°</span>\n                    </div>\n                </div>\n                \n                <div class=\"formula-note\">\n                    公式: 目标大小度数 = 光口摆动距离 / X * 360°\n                </div>\n            </div>\n            \n            <div class=\"module module-2\">\n                <h2>模块二：计算X值</h2>\n                \n                <div class=\"gjjz-input-group\">\n                    <label for=\"hand-length-2\">手长 (cm)</label>\n                    <input type=\"number\" id=\"hand-length-2\" min=\"10\" max=\"30\" step=\"0.1\" value=\"18\">\n                </div>\n                \n                <div class=\"gjjz-input-group\">\n                    <label for=\"swing-angle-2\">手的摆动角度 (度)</label>\n                    <input type=\"number\" id=\"swing-angle-2\" min=\"0\" max=\"180\" step=\"1\" value=\"50\">\n                </div>\n                \n                <div class=\"gjjz-input-group\">\n                    <label>光口上下比例位置</label>\n                    <div class=\"custom-vertical-slider\">\n                        <div style=\"display: flex; align-items: center; gap: 5px;\">\n                            <svg id=\"lock-button-2\" class=\"lock-button\" viewBox=\"0 0 16 16\">\n                                <path d=\"M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm2 5V3a3 3 0 1 0-6 0v3H4a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-1zM4 7h8v7H4V7z\"/>\n                            </svg>\n                            <span id=\"light-ratio-display-2\" class=\"ratio-display\">0.69</span>\n                            <input type=\"number\" id=\"wrist-to-light-input-2\" style=\"display: none; width: 80px; text-align: right;\" step=\"0.1\" min=\"0\">\n                        </div>\n                        <div class=\"slider-wrapper\">\n                            <input type=\"range\" id=\"light-ratio-2\" class=\"vertical-custom\" min=\"0\" max=\"16\" step=\"1\" value=\"11\" orient=\"vertical\">\n                        </div>\n      \n                        <div class=\"slider-markers\">\n                            <span>16</span>\n                            <span>12</span>\n                            <span>8</span>\n                            <span>4</span>\n                            <span>0</span>\n                        </div>\n                    </div>\n                </div>\n               \n                <div class=\"gjjz-input-group\">\n                    <label for=\"target-degree-input\">目标大小度数 (度)</label>\n                    <input type=\"number\" id=\"target-degree-input\" min=\"1\" max=\"360\" step=\"0.1\" value=\"1\">\n                </div>\n                \n                <div class=\"gjjz-results\">\n                    <div class=\"result-item\">\n                        <span class=\"result-label\">光口摆动距离:</span>\n                        <span class=\"result-value\" id=\"swing-distance-2\">5.81 cm</span>\n                    </div>\n                    <div class=\"result-item\">\n                        <span class=\"result-label\">X值 (CM/360°):</span>\n                        <span class=\"result-value\" id=\"x-value-result\">40.00</span>\n                    </div>\n                </div>\n                \n                <div class=\"formula-note\">\n                    公式: X = 光口摆动距离 / 目标大小度数 * 360°\n                </div>\n            </div>\n            \n            <div class=\"module module-3\">\n                <h2>模块三：值的百分比增减&根号计算</h2>\n                \n                <div class=\"gjjz-input-group-row\">\n                    <div class=\"gjjz-input-group\">\n                        <label for=\"x-value-input-1\">值A</label>\n                        <input type=\"number\" id=\"x-value-input-1\" min=\"1\" max=\"99999\" step=\"0.1\" value=\"4000\">\n                    </div>\n                    <div class=\"gjjz-input-group\">\n                        <label for=\"x-value-input-2\">值B</label>\n                        <input type=\"number\" id=\"x-value-input-2\" min=\"1\" max=\"99999\" step=\"0.1\" value=\"3000\">\n                    </div>\n                </div>\n                \n                <div class=\"gjjz-results\">\n                    <div class=\"result-item\">\n                        <span class=\"result-label\">以A为基准值:</span>\n                        <span class=\"result-value\" id=\"percentage-change\">0%</span>\n                    </div>\n                </div>\n    \n                <div class=\"separator\"></div>\n                \n                <div class=\"gjjz-input-group\">\n                    <label for=\"sqrt-input\">开根计算器</label>\n                    <input type=\"number\" id=\"sqrt-input\" step=\"0.1\" value=\"100\">\n                </div>\n                \n                <div class=\"gjjz-results\">\n                    <div class=\"result-item\">\n                        <span class=\"result-label\">计算结果:</span>\n                        <span class=\"result-value\" id=\"sqrt-result\">0</span>\n                    </div>\n                </div>\n                \n                <div class=\"separator\"></div>\n    \n                <div class=\"gjjz-input-group-row\">\n                    <div class=\"gjjz-input-group\">\n                        <label for=\"original-value\">原始值</label>\n                        <input type=\"number\" id=\"original-value\" step=\"0.1\" value=\"100\">\n                    </div>\n                    <div class=\"gjjz-input-group\">\n                        <label for=\"change-percentage\">增减百分比 (%)</label>\n                        <input type=\"number\" id=\"change-percentage\" step=\"0.1\" value=\"10\">\n                    </div>\n                </div>\n                \n                <div class=\"gjjz-results\">\n                    <div class=\"result-item\">\n                        <span class=\"result-label\">变化后的值:</span>\n                        <span class=\"result-value\" id=\"changed-value\">0</span>\n                    </div>\n                </div>\n    \n            </div>\n    \n            <div class=\"module module-4\">\n                <h2>模块四：说明</h2>\n                <div class=\"formula-note\">\n    我认为手部摆动的角度的大小不一，会与我理想结果不同。<br>\n    故而设计一个多用的灵敏度校准工具。<br><br>\n    \n    校准手部角度与灵敏度的方法：<br>\n    1. 在模块一、二当中填入手的大小（腕部上横线到中指尖），X值<br>\n    2. 在模块一当中填入手的摆动角度，模块二默认50°不要动<br>\n    3. 其他一切不要动<br>\n    4. 模块一目标大小度数填入模块二当中<br>\n    5. 得到模块二X值，以此作为校准后的X值<br><br>\n    \n    其他种种玩法调法，各位自行摸索。\n                </div>\n                <div class=\"formula-note\">\n                    摆动公式：<br>\n                    弧度=度 × 180/π<br>\n                    手腕上横线到鼠标光口位置 = 手长 * 光口上下位置比例<br>\n                    光口摆动距离 = 手腕上横线到鼠标光口位置 * 手部摆动弧度\n                </div>\n                <div class=\"formula-note\">\n                    特定概念：<br>\n                    X = 一个在 CM/360° 单位下的数值<br>\n                    X的计算方式：固定手腕以最大幅度摆动，准星移动后，以恰好的角度经过游戏内目标大小的cm/360°灵敏度。\n                </div>\n                <div class=\"formula-note\">\n                    目标大小度数: 游戏内目标所占据的游戏内角度。\n                </div>\n            </div>\n        </div>\n    \n        <div class=\"author-info\">\n            作者：<a href=\"https://space.bilibili.com/1534330\" target=\"_blank\">西岛海</a>\n        </div>\n    </div>\n\n\n\n\n    <script>\n\n\n// ==========================================================================\n    // 灵敏度公式工具核心逻辑 (S = L^0.3333, 最慢 2A^PWR, 最快 A^PWR)\n    // ==========================================================================\n    \n    const S_PWR = 0.3333;          // 计算隐性变量 S 的幂 (开立方)\n    const EVOLVE_PWR = 0.381966;   // 黄金演化幂\n\n    // 五档配置定义：ratio 0 为最快(端点1)，1 为最慢(端点2)\n    const formulaConfigs = [\n        { id: 'mirror_extreme', title: '最快档', ratio: 0,    color: 'var(--accent-red)',    desc: 'A^0.381966' },\n        { id: 'mirror_fast',    title: '快速档', ratio: 0.25, color: 'var(--accent-gold)',   desc: '25% 插值' },\n        { id: 'origin',         title: '平衡档', ratio: 0.50, color: 'var(--text-secondary)', desc: '50% 插值' },\n        { id: 'speed',          title: '稳健档', ratio: 0.75, color: 'var(--accent-green)',   desc: '75% 插值' },\n        { id: 'accuracy',       title: '最慢档', ratio: 1,    color: 'var(--accent-blue)',    desc: '2A^0.381966' }\n    ];\n\n    let rowStates = {};\n    formulaConfigs.forEach(c => {\n        rowStates[c.id] = { multiplier: 1.0, physVal: 0, currentBase: 0 };\n    });\n\n    const P3_FACTOR = { left: 360/(360+45), right: 360/(360-45) };\n\n    function renderRows() {\n        const container = document.getElementById('resultsArea');\n        if (!container) return;\n        container.innerHTML = '';\n        \n        formulaConfigs.forEach(config => {\n            container.innerHTML += `\n            <div class=\"complex-result-row\">\n                <div class=\"panel-left\">\n                    <div style=\"font-size:0.7rem; color:var(--text-secondary)\">修正倍率</div>\n                    <input type=\"number\" class=\"multiplier-input\" value=\"1.0\" step=\"0.05\" onchange=\"updateMultiplier('${config.id}', this.value)\">\n                </div>\n                <div class=\"panel-center\" style=\"border-top: 3px solid ${config.color}\">\n                    <div class=\"result-label\" style=\"color:${config.color}\">${config.title}</div>\n                    <div class=\"main-value-container\">\n                        <div class=\"val-adjusted-box\">\n                            <div class=\"label\" style=\"font-size:0.65rem\">最终还原结果 (cm/360°)</div>\n                            <div class=\"result-value-main\" id=\"val-phys-${config.id}\" style=\"font-size:1.8rem\">--</div>\n                        </div>\n                    </div>\n                </div>\n                <div class=\"panel-right\">\n                    <div style=\"display:flex; justify-content:space-between; font-size:0.8rem\">\n                        <span style=\"color:var(--accent-green)\">三阶校准 (Ⅲ)</span>\n                        <button class=\"btn-reset\" onclick=\"resetCalibration('${config.id}')\">重置</button>\n                    </div>\n                    <div class=\"current-base-val\" id=\"val-cal-${config.id}\">--</div>\n                    <div class=\"calibration-actions\">\n                        <button class=\"cal-btn btn-fast\" onclick=\"applyCalibration('${config.id}', 'left')\">偏快 <span id=\"pre-f-${config.id}\">--</span></button>\n                        <button class=\"cal-btn btn-slow\" onclick=\"applyCalibration('${config.id}', 'right')\">偏慢 <span id=\"pre-s-${config.id}\">--</span></button>\n                    </div>\n                </div>\n            </div>`;\n        });\n    }\n\n    function calculateAll() {\n        const x = parseFloat(document.getElementById('x').value) || 0;\n        const y = parseFloat(document.getElementById('y').value) || 0;\n        const inputL = parseFloat(document.getElementById('thumb_l').value) || 1.0;\n\n        if (x + y === 0 || inputL === 0) return;\n\n        // 1. 计算隐性 S = L^0.3333\n        const S = Math.pow(inputL, S_PWR);\n\n        // 2. 计算 A = (X + Y) / S\n        const A = (x + y) / S; \n\n        // 3. 计算端点演化\n        const baseEvolved = Math.pow(A, EVOLVE_PWR);\n        const fastA = baseEvolved;           // 最快端点 (A^0.381966)\n        const slowA = 2 * baseEvolved;       // 最慢端点 (2A^0.381966)\n\n        // 4. 四分法线性插值并升维还原\n        formulaConfigs.forEach(config => {\n            const r = config.ratio;\n            // 线性插值\n            const currentA = fastA + (slowA - fastA) * r;\n            \n            // 5. 还原最终物理值 = A * S\n            rowStates[config.id].physVal = currentA * S;\n            updateRowDisplay(config.id);\n        });\n    }\n\n    function updateRowDisplay(id) {\n        const state = rowStates[id];\n        const m = state.multiplier;\n        const finalVal = (state.physVal * m).toFixed(2);\n        \n        const el = document.getElementById(`val-phys-${id}`);\n        if (el) el.textContent = finalVal + \" cm\";\n        \n        state.currentBase = state.physVal * m;\n        updateCalibrationUI(id);\n    }\n\n    function applyCalibration(id, side) {\n        rowStates[id].currentBase *= (side === 'left' ? P3_FACTOR.left : P3_FACTOR.right);\n        updateCalibrationUI(id);\n    }\n\n    function resetCalibration(id) {\n        rowStates[id].currentBase = rowStates[id].physVal * rowStates[id].multiplier;\n        updateCalibrationUI(id);\n    }\n\n    function updateCalibrationUI(id) {\n        const b = rowStates[id].currentBase;\n        const el = document.getElementById(`val-cal-${id}`);\n        if (el) {\n            el.textContent = b.toFixed(2);\n            const preF = document.getElementById(`pre-f-${id}`);\n            const preS = document.getElementById(`pre-s-${id}`);\n            if(preF) preF.textContent = (b * P3_FACTOR.left).toFixed(2);\n            if(preS) preS.textContent = (b * P3_FACTOR.right).toFixed(2);\n        }\n    }\n\n    function updateMultiplier(id, val) {\n        rowStates[id].multiplier = parseFloat(val) || 1;\n        updateRowDisplay(id);\n    }\n\n    // 初始化加载与实时事件绑定\n    document.addEventListener('DOMContentLoaded', () => {\n        renderRows();\n        calculateAll();\n        // 绑定输入监听\n        ['x', 'y', 'thumb_l'].forEach(id => {\n            const el = document.getElementById(id);\n            if (el) el.addEventListener('input', calculateAll);\n        });\n    });\n\n\n\n    <\/script>\n\n\n\n\n\n\n    <script>\n        // 锁头状态变量\n        let isLocked1 = true;\n        let isLocked2 = true;\n\n        // 锁头图标的 SVG 路径\n        const lockIcon = '<path d=\"M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm2 5V3a3 3 0 1 0-6 0v3H4a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-1zM4 7h8v7H4V7z\"/>';\n        const unlockIcon = '<path d=\"M11 1a2 2 0 0 1 2 2v4H9V3a2 2 0 0 1 2-2zM9 5h2v2h2v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2V3a3 3 0 0 1 4.417-2.756zM8 7H6V3a3 3 0 0 0-6 0v4h2v2H2v5a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2V3a3 3 0 0 0 2-2z\"/>';\n        \n        // 绑定事件监听器\n        document.getElementById('style-switcher').addEventListener('click', toggleGjjzStyle);\n        document.getElementById('hand-length-1').addEventListener('input', calculateModule1);\n        document.getElementById('swing-angle-1').addEventListener('input', calculateModule1);\n        document.getElementById('light-ratio-1').addEventListener('input', calculateModule1);\n        document.getElementById('x-value-1').addEventListener('input', calculateModule1);\n        document.getElementById('lock-button-1').addEventListener('click', toggleLock1);\n        document.getElementById('wrist-to-light-input-1').addEventListener('input', calculateModule1);\n        document.getElementById('hand-length-2').addEventListener('input', calculateModule2);\n        document.getElementById('swing-angle-2').addEventListener('input', calculateModule2);\n        document.getElementById('target-degree-input').addEventListener('input', calculateModule2);\n        document.getElementById('light-ratio-2').addEventListener('input', calculateModule2);\n        document.getElementById('lock-button-2').addEventListener('click', toggleLock2);\n        document.getElementById('wrist-to-light-input-2').addEventListener('input', calculateModule2);\n        document.getElementById('x-value-input-1').addEventListener('input', calculateModule3);\n        document.getElementById('x-value-input-2').addEventListener('input', calculateModule3);\n        document.getElementById('original-value').addEventListener('input', calculateModule3);\n        document.getElementById('change-percentage').addEventListener('input', calculateModule3);\n        document.getElementById('sqrt-input').addEventListener('input', calculateModule3);\n        \n        // GJJZ 风格切换 (内部切换)\n        function toggleGjjzStyle() {\n            const body = document.body;\n            const styleSwitcher = document.getElementById('style-switcher');\n            if (body.classList.contains('style-1')) {\n                body.classList.remove('style-1');\n                body.classList.add('style-2');\n                styleSwitcher.textContent = '切换至默认风格';\n            } else {\n                body.classList.remove('style-2');\n                body.classList.add('style-1');\n                styleSwitcher.textContent = '切换至硬朗风格';\n            }\n        }\n\n        function toggleLock1() {\n            isLocked1 = !isLocked1;\n            const slider = document.getElementById('light-ratio-1');\n            const input = document.getElementById('wrist-to-light-input-1');\n            const lockButton = document.getElementById('lock-button-1');\n            const ratioDisplay = document.getElementById('light-ratio-display-1');\n            if (isLocked1) {\n                slider.style.display = 'block';\n                input.style.display = 'none';\n                lockButton.innerHTML = lockIcon;\n                ratioDisplay.style.display = 'block';\n            } else {\n                slider.style.display = 'none';\n                input.style.display = 'block';\n                lockButton.innerHTML = unlockIcon;\n                ratioDisplay.style.display = 'none';\n            }\n            calculateModule1();\n        }\n\n        function toggleLock2() {\n            isLocked2 = !isLocked2;\n            const slider = document.getElementById('light-ratio-2');\n            const input = document.getElementById('wrist-to-light-input-2');\n            const lockButton = document.getElementById('lock-button-2');\n            const ratioDisplay = document.getElementById('light-ratio-display-2');\n            if (isLocked2) {\n                slider.style.display = 'block';\n                input.style.display = 'none';\n                lockButton.innerHTML = lockIcon;\n                ratioDisplay.style.display = 'block';\n            } else {\n                slider.style.display = 'none';\n                input.style.display = 'block';\n                lockButton.innerHTML = unlockIcon;\n                ratioDisplay.style.display = 'none';\n            }\n            calculateModule2();\n        }\n\n        function calculateModule1() {\n            const handLength = parseFloat(document.getElementById('hand-length-1').value);\n            const swingAngle = parseFloat(document.getElementById('swing-angle-1').value);\n            const xValue = parseFloat(document.getElementById('x-value-1').value);\n            \n            let wristToLightOpening;\n            if (isLocked1) {\n                const lightRatio = parseFloat(document.getElementById('light-ratio-1').value);\n                const ratioValue = lightRatio / 16;\n                document.getElementById('light-ratio-display-1').textContent = ratioValue.toFixed(4);\n                wristToLightOpening = handLength * ratioValue;\n            } else {\n                wristToLightOpening = parseFloat(document.getElementById('wrist-to-light-input-1').value);\n            }\n\n            const swingRadians = swingAngle * (Math.PI / 180);\n            const lightOpeningDistance = wristToLightOpening * swingRadians;\n            \n            const targetSizeDegree = (lightOpeningDistance / xValue) * 360;\n            \n            document.getElementById('swing-distance-1').textContent = lightOpeningDistance.toFixed(2) + ' cm';\n            document.getElementById('target-degree-1').textContent = targetSizeDegree.toFixed(8) + '°';\n        }\n        \n        function calculateModule2() {\n            const handLength = parseFloat(document.getElementById('hand-length-2').value);\n            const swingAngle = parseFloat(document.getElementById('swing-angle-2').value);\n            const targetDegree = parseFloat(document.getElementById('target-degree-input').value);\n            \n            let wristToLightOpening;\n            if (isLocked2) {\n                const lightRatio = parseFloat(document.getElementById('light-ratio-2').value);\n                const ratioValue = lightRatio / 16;\n                document.getElementById('light-ratio-display-2').textContent = ratioValue.toFixed(4);\n                wristToLightOpening = handLength * ratioValue;\n            } else {\n                wristToLightOpening = parseFloat(document.getElementById('wrist-to-light-input-2').value);\n            }\n\n            const swingRadians = swingAngle * (Math.PI / 180);\n            const lightOpeningDistance = wristToLightOpening * swingRadians;\n            \n            const xValue = (lightOpeningDistance / targetDegree) * 360;\n            \n            document.getElementById('swing-distance-2').textContent = lightOpeningDistance.toFixed(2) + ' cm';\n            document.getElementById('x-value-result').textContent = xValue.toFixed(2);\n        }\n        \n        function calculateModule3() {\n            const xValue1 = parseFloat(document.getElementById('x-value-input-1').value);\n            const xValue2 = parseFloat(document.getElementById('x-value-input-2').value);\n            const percentageChange = ((xValue2 - xValue1) / xValue1) * 100;\n            let displayValue = percentageChange.toFixed(2) + '%';\n            if (percentageChange > 0) {\n                displayValue = '+' + displayValue;\n            }\n            document.getElementById('percentage-change').textContent = displayValue;\n\n            const sqrtInput = parseFloat(document.getElementById('sqrt-input').value);\n            let sqrtResult;\n            if (sqrtInput >= 0) {\n                sqrtResult = Math.sqrt(sqrtInput);\n                document.getElementById('sqrt-result').textContent = sqrtResult.toFixed(2);\n            } else {\n                document.getElementById('sqrt-result').textContent = '无效输入';\n            }\n\n            const originalValue = parseFloat(document.getElementById('original-value').value);\n            const changePercentage = parseFloat(document.getElementById('change-percentage').value);\n            const changedVa  bottom: 20px;\n            left: 20px;\n        }\n        #photo-frame-portal.expanded {\n            width: 90vw;\n        }\n    }\n</style>\n\n<script>\n    function togglePhotoSize() {\n        const portal = document.getElementById('photo-frame-portal');\n        portal.classList.toggle('expanded');\n    }\n<\/script>\n\n<script>\n    // 获取切换按钮\n    const switchBtn = document.getElementById('main-view-switch');\n    \n    // 获取两个视图容器\n    const viewBdf = document.getElementById('view-bdf');\n    const viewGjjz = document.getElementById('view-gjjz');\n    \n    // 当前模式标记\n    let isBdfMode = true;\n    \n    // 切换按钮点击事件\n    switchBtn.addEventListener('click', function() {\n        if (isBdfMode) {\n            // 切换到 GJJZ 模式（使用 style-1 风格）\n            document.body.classList.remove('bdf-mode');\n            document.body.classList.add('gjjz-mode', 'style-1');\n            switchBtn.textContent = '切换至灵敏度公式工具';\n            viewBdf.style.display = 'none';\n            viewGjjz.style.display = 'flex';\n            isBdfMode = false;\n        } else {\n            // 切换回 BDF 模式\n            document.body.classList.remove('gjjz-mode', 'style-1', 'style-2');\n            document.body.classList.add('bdf-mode');\n            switchBtn.textContent = '切换至手部校准工具';\n            viewGjjz.style.display = 'none';\n            viewBdf.style.display = 'flex';\n            isBdfMode = true;\n        }\n    });\n<\/script>\n\n<a href=\"https://xidaohai.github.io/gs.html\" class=\"fixed-bottom-left\">\n    等身测量法\n</a>\n\n<style>\n    .fixed-bottom-left {\n        /* 定位核心代码 */\n        position: fixed;   /* 固定定位 */\n        bottom: 20px;      /* 距离底部 20 像素 */\n        left: 12px;        /* 距离左侧 20 像素 */\n        z-index: 999;      /* 确保在页面最顶层 */\n\n        /* 样式美化 */\n        padding: 7px 15px;\n        background-color: #0056b3;\n        color: white;\n        text-decoration: none; /* 去掉超链接下划线 */\n        border-radius: 10px;    /* 圆角 */\n        box-shadow: 0 4px 6px rgba(0,0,0,0.1);\n        font-family: sans-serif;\n    }\n\n    .fixed-bottom-left:hover {\n        background-color: #e4733ffb; /* 鼠标悬停变色 */\n    }\n</style>\n\n</body>\n</html>");
        f2.contentWindow.document.close();

        
        // --- 交互逻辑 (拖拽模式) ---
        btn.style.cursor = 'move';
        let isDrag = false;
        let startX, startY;
        let currentX = -722, currentY = -14;

        btn.addEventListener('pointerdown', (e) => {
            isDrag = false;
            startX = e.clientX;
            startY = e.clientY;
            btn.setPointerCapture(e.pointerId);
            btn.addEventListener('pointermove', onMove);
            btn.addEventListener('pointerup', onUp);
        });

        function onMove(e) {
            if (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5) {
                isDrag = true;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                const nx = currentX + dx;
                const ny = currentY + dy;
                btn.style.transform = `translate(-50%, -50%) translate(${nx}px, ${ny}px)`;
            }
        }

        function onUp(e) {
            btn.removeEventListener('pointermove', onMove);
            btn.removeEventListener('pointerup', onUp);
            if (isDrag) {
                currentX += (e.clientX - startX);
                currentY += (e.clientY - startY);
            } else {
                // 如果不是拖拽，且不是纯展示模式，则执行点击动作
                isPage1 = !isPage1;
                    f1.style.display = isPage1 ? 'block' : 'none';
                    f2.style.display = isPage1 ? 'none' : 'block';
            }
        }

    </script>
